<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="color-scheme" content="dark light">
    <meta name="theme-color" content="#14110d">
    <!-- 홈 화면에 두면 앱처럼 열린다 — 매니페스트도 아이콘도 이 콘솔이 서빙하는 제 것이다
         (CDN 0: 이 페이지가 남의 서버를 부르는 일은 없다). 정적 데모에서는 같은 파일들이
         함께 나간다. -->
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/icon.svg">
    <title>magi console</title>
    <!-- 테마를 첫 페인트 전에: 어두운 방에서 흰 플래시를 내지 않는다 (기존 콘솔과 같은 4줄). -->
    <script>
      try {
        var want = localStorage.getItem('theme');
        if (want === 'light' || want === 'dark') document.documentElement.setAttribute('color-theme', want);
      } catch (e) { /* storage can be denied */ }
    </script>
    <!-- 팔레트·컴포넌트 토큰·플릿 표 전부: 기존 콘솔의 page.css를 빌드가 그대로 복사한 것.
         스냅샷이 아니라 assembleConsole이 매번 cmd/magi-web/page.css에서 가져온다. -->
    <link rel="stylesheet" href="/ui/console.css">
    <!-- 셸 자신의 것(2단 드로어) — console.css의 토큰 위에 얹는다. -->
    <link rel="stylesheet" href="/ui/shell.css">
    <!-- 정적 데모에서 목이 들어서는 자리 — 여기서부터 아래가 회선을 여는 코드라, 목은
         반드시 그 앞에 선다. 표식으로 두는 이유: 앞서는 "첫 <script src=" 앞에" 넣었는데
         부트스트랩을 자바스크립트로 옮기자 그런 태그가 사라져 목이 조용히 빠졌다(데모 전체가
         404). 표식이 없으면 데모 생성이 <b>실패</b>한다 — 조용히 빠지느니. -->
    <!--DEMO-SHIM-->
    <!-- 머티리얼 웹 컴포넌트: BFF가 서빙하는 번들을 프록시로 그대로 쓴다(두 콘솔이 한 번들). -->
    <!-- 머티리얼 웹 컴포넌트: BFF가 서빙하는 번들을 프록시로 그대로 쓴다(두 콘솔이 한 번들).
         그리고 RxJS — 이 콘솔의 스토어들이 그 위에 산다. 자바 쪽 바인딩은 전역 `rxjs`를
         보고 컴파일되므로(dev.sayaya.rx: @JsType namespace="rxjs"), 번들의 이름들을 그 자리에
         올려 둔다. 셸 부트스트랩은 그 <b>다음에</b> 넣는다 — 모듈 스크립트는 미뤄지고 GWT
         부트스트랩은 미뤄지지 않아, 나란히 적으면 스토어가 아직 없는 전역을 부른다. -->
    <script type="module">
      import '/vendor/material.js';
      import * as rxjs from '/vendor/rxjs.js';
      window.rxjs = rxjs;
      const boot = () => {
        const s = document.createElement('script');
        s.src = '/ui/shell/shell.nocache.js';
        document.head.append(s);
      };
      // 데모라면 목이 먼저 선다 — 셸이 먼저 물으면 그 물음은 정적 사이트에서 404가 되고,
      // 그 404를 받은 화면은 "못 읽었다"를 그린 채 다음 폴까지 서 있는다. 목이 실렸다는
      // 사실은 그 모듈이 창에 적는다(bridge.Demo). 오지 않으면 3초 뒤 그냥 시작한다:
      // 목이 없는 데모는 빈 콘솔이지만, 멈춘 콘솔보다는 낫다.
      if (window.MAGI_DEMO) {
        const mock = document.createElement('script');
        mock.src = './ui/demo/demo.nocache.js';
        document.head.append(mock);
        const since = Date.now();
        const wait = () => (window.__magi_demo_mock || Date.now() - since > 3000) ? boot() : setTimeout(wait, 20);
        wait();
      } else boot();
    </script>
</head>
<body>
<!-- 그림 정의, 아니면 아무것도. 이 표식 자리에 빌드가 구운 스프라이트가 들어간다(라이선스가
     없는 빌드에서는 표식만 사라지고, 화면들은 늘 그리던 제 도형을 그린다). 남의 서버를
     부르지 않는다는 규칙이 그림에도 걸린다. -->
<!--ICON-SPRITE--></body>
</html>
