# handbook의 Web UI 카탈로그를 그대로 미러한다 (settings.gradle.kts §Web UI 참조).
# 버전 올릴 때 여기 한 곳만 고치면 된다.

[versions]
elemento = "2.4.9"
sayaya-ui = "2.4.1.3"
sayaya-rx = "2.2.3"
dagger = "2.59.1"
lombok = "1.18.42"
sayaya-test = "2.2.9.5"
junit5 = "6.0.3"

[libraries]
elemento-core = { module = "org.jboss.elemento:elemento-core", version.ref = "elemento" }
sayaya-ui = { module = "dev.sayaya:ui", version.ref = "sayaya-ui" }
sayaya-rx = { module = "dev.sayaya:rx", version.ref = "sayaya-rx" }
# GWT 모듈(dagger/Dagger.gwt.xml)은 dagger가 아니라 dagger-gwt 아티팩트에 실려 있다 —
# 일반 dagger를 넣으면 gwtCompile이 "Unable to find dagger/Dagger.gwt.xml"로 죽는다(실측).
dagger-gwt = { module = "com.google.dagger:dagger-gwt", version.ref = "dagger" }
dagger-compiler = { module = "com.google.dagger:dagger-compiler", version.ref = "dagger" }
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }
junit5 = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit5" }
gwt-test = { module = "dev.sayaya:gwt-test", version.ref = "sayaya-test" }

[bundles]
sayaya-web = ["elemento-core", "dagger-gwt", "dagger-compiler", "sayaya-ui", "sayaya-rx", "lombok"]
test-web = ["junit5", "gwt-test"]
