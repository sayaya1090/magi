<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Magi 메일</title><style>body{font:16px system-ui;margin:20px}main{display:grid;grid-template-columns:1fr 1fr;gap:20px}button,input,textarea{font:inherit}textarea{width:95%;min-height:120px}pre{white-space:pre-wrap;overflow-wrap:anywhere}li button{text-align:left;width:100%}#status{color:#a22}#events{height:420px;overflow:auto;border:1px solid #888;padding:8px}@media(max-width:700px){main{display:block}}</style><h1>Magi 메일</h1><label>로컬 연결 토큰 <input id="token" type="password"></label><button id="load">INBOX 새로고침</button><p id="status" role="status"></p><main><section><h2>최근 메일</h2><ul id="list"></ul><h2 id="subject">본문</h2><pre id="body"></pre><details><summary>MIME 원문</summary><pre id="raw"></pre></details><h2>발송 초안</h2><label>받는 사람 <input id="to" type="email"></label><label>제목 <input id="title"></label><textarea id="draft" aria-label="메일 본문"></textarea><button id="getDraft">Magi 초안 가져오기</button><button id="send">확인 후 발송</button></section><section><h2>Magi 채팅</h2><p>선택한 메일에 세션이 연결됩니다. 메일 본문은 읽기 도구를 요청할 때만 모델에 전달됩니다.</p><div id="events" role="log" aria-live="polite"></div><div id="asks" aria-live="polite"></div><textarea id="chat" aria-label="Magi 요청"></textarea><button id="request">요청 보내기</button><button id="interrupt">작업 중단</button><button id="new">새 세션</button><label>모델 <input id="model"></label><button id="setModel">모델 변경</button></section></main><script>
const $=id=>document.getElementById(id);let binding='',session='',target='',controller,selection=0;async function api(path,body){const r=await fetch(path,{method:body?'POST':'GET',headers:{Authorization:'Bearer '+$('token').value,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const text=await r.text();let j;try{j=JSON.parse(text)}catch{if(!r.ok)throw Error(text.trim()||'요청 실패 ('+r.status+')');throw Error('서버 응답을 읽을 수 없습니다')}if(!r.ok)throw Error(j.error||'요청 실패');return j}function safe(fn){return async()=>{try{$('status').textContent='';await fn()}catch(e){$('status').textContent=e.message}}}function stop(){controller?.abort();controller=null}
$('load').onclick=safe(async()=>{const d=await api('/mail/list');$('list').replaceChildren();for(const m of d.items.slice().reverse()){const li=document.createElement('li'),b=document.createElement('button');b.textContent=m.subject+' · '+m.from;b.onclick=safe(async()=>{const picked=++selection;stop();binding='';session='';target='';for(const id of ['to','title','draft','chat'])$(id).value='';$('events').replaceChildren();$('asks').replaceChildren();const msg=await api('/mail/read',{mailbox:'INBOX',uidValidity:d.uidValidity,uid:m.uid});if(picked!==selection)return;$('body').textContent=msg.text;$('raw').textContent=msg.raw;$('subject').textContent=m.subject;target=d.account+'/INBOX/'+d.uidValidity+'/'+m.uid;const s=await api('/api/connect',{target});if(picked!==selection)return;binding=s.binding;session=s.session;$('events').textContent='';$('asks').replaceChildren();stream(binding);});li.append(b);$('list').append(li)}});
function showAsk(event,key){const d=event.data;if(!d||typeof d.callId!=='string')return;if(event.type==='permission.decided'||event.type==='question.answered'){for(const row of $('asks').children)if(row.dataset.callId===d.callId)row.remove();return}if(event.type!=='permission.requested'&&event.type!=='question.requested')return;for(const row of $('asks').children)if(row.dataset.callId===d.callId)return;const row=document.createElement('section');row.dataset.callId=d.callId;const label=document.createElement('pre');label.textContent=event.type==='permission.requested'?'승인 요청: '+d.name+'\n'+JSON.stringify(d.args,null,2)+'\n'+(d.reason||'')+(d.diff?'\n'+d.diff:''):(d.question||'질문')+'\n'+JSON.stringify(d.report||[]);row.append(label);function action(text,payload){const button=document.createElement('button');button.textContent=text;button.onclick=safe(async()=>{if(binding!==key)throw Error('다른 메일의 요청입니다');await api('/api/request',{binding:key,callId:d.callId,...payload});row.remove()});row.append(button)}if(event.type==='permission.requested'){action('허용',{method:'permission',decision:'allow'});action('거부',{method:'permission',decision:'deny'})}else{for(const option of d.options||[])action(option,{method:'reply',answer:option});const input=document.createElement('input');input.setAttribute('aria-label','질문 답변');row.append(input);const button=document.createElement('button');button.textContent='답변';button.onclick=safe(async()=>{if(binding!==key)throw Error('다른 메일의 질문입니다');await api('/api/request',{binding:key,method:'reply',callId:d.callId,answer:input.value});row.remove()});row.append(button)}$('asks').append(row)}
function showEvent(event){const d=event.data||{};let who='',body='';if(event.type==='prompt.submitted'){who='사용자';body=(d.parts||[]).map(p=>p.text||'').join('')}else if(event.type==='part.appended'){const p=d.part||{};who=p.kind==='tool-call'||p.kind==='tool-result'?'도구':d.role==='assistant'?'Magi':d.role||'메시지';body=p.text??(p.kind==='tool-call'?(p.toolCall?.name||p.name||'도구 호출')+'\n'+JSON.stringify(p.toolCall?.args||p.args||{}):JSON.stringify(p.toolResult?.content??p.content??p,null,2))}else if(event.type==='error'){who='오류';body=d.message||d.error||JSON.stringify(d)}else if(event.type==='turn.finished'){who='상태';body='요청 처리 완료'}if(!who)return;const row=document.createElement('section'),label=document.createElement('strong'),text=document.createElement('pre');label.textContent=who;text.textContent=body;row.append(label,text);$('events').append(row)}
async function stream(key){const version=selection;controller=new AbortController();try{const r=await fetch('/api/events?binding='+encodeURIComponent(key),{headers:{Authorization:'Bearer '+$('token').value},signal:controller.signal});if(!r.ok)throw Error('이벤트 연결 실패');const reader=r.body.getReader(),decoder=new TextDecoder();let pending='';while(true){const {value,done}=await reader.read();if(done){if(binding===key&&version===selection)$('status').textContent='대화 연결이 종료되었습니다. 메일을 다시 선택해 주세요.';break;}if(binding!==key||version!==selection)break;const chunk=decoder.decode(value,{stream:true});pending+=chunk;let split;while((split=pending.indexOf('\n\n'))>=0){const block=pending.slice(0,split);pending=pending.slice(split+2);const data=block.split('\n').filter(x=>x.startsWith('data:')).map(x=>x.slice(5).trimStart()).join('\n');if(data){try{const event=JSON.parse(data);if(event.sessionId!==session)continue;showAsk(event,key);showEvent(event)}catch{}}}$('events').scrollTop=$('events').scrollHeight}}catch(e){if(e.name!=='AbortError'&&version===selection)$('status').textContent=e.message}}

$('request').onclick=safe(async()=>{if(!binding)throw Error('먼저 메일을 선택하세요');const picked=selection,key=binding,text=$('chat').value;await api('/api/request',{binding:key,method:'say',text});if(picked===selection&&key===binding&&$('chat').value===text)$('chat').value=''});
$('interrupt').onclick=safe(async()=>{if(!binding)throw Error('먼저 메일을 선택하세요');await api('/api/request',{binding,method:'interrupt'})});
$('setModel').onclick=safe(async()=>{if(!binding)throw Error('먼저 메일을 선택하세요');await api('/api/request',{binding,method:'model',name:$('model').value})});
$('new').onclick=safe(async()=>{if(!binding)throw Error('먼저 메일을 선택하세요');const key=binding,picked=selection;const result=await api('/api/request',{binding:key,method:'new'});if(key!==binding||picked!==selection)return;if(typeof result.session!=='string')throw Error('새 세션 응답을 읽을 수 없습니다');stop();selection++;session=result.session;$('events').replaceChildren();$('asks').replaceChildren();stream(key)});
$('getDraft').onclick=safe(async()=>{if(!target)throw Error('먼저 메일을 선택하세요');const picked=selection,boundTarget=target;const d=await api('/mail/draft?target='+encodeURIComponent(boundTarget));if(picked!==selection||boundTarget!==target)return;$('to').value=d.to||'';$('title').value=d.subject||'';$('draft').value=d.body||''});
$('send').onclick=safe(async()=>{const d={to:$('to').value,subject:$('title').value,body:$('draft').value};if(!confirm('다음 메일을 실제로 발송할까요?\n받는 사람: '+d.to+'\n제목: '+d.subject+'\n\n'+d.body))return;$('send').disabled=true;try{await api('/mail/send',{draft:d,confirm:true});$('status').textContent='발송 완료'}finally{$('send').disabled=false}});window.addEventListener('pagehide',stop);
</script></html>
