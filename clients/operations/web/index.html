<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Magi 운영</title>
<style>body{font:16px system-ui;margin:24px;max-width:900px}textarea{width:100%;min-height:90px;box-sizing:border-box}pre{white-space:pre-wrap;overflow-wrap:anywhere}button,input{font:inherit}#events{height:50vh;overflow:auto;border:1px solid #888;padding:12px}</style>
<h1>Magi 운영</h1><label>연결 토큰 <input id="token" type="password"></label><button id="connect">연결</button><p id="target"></p><p id="status" role="status"></p><div id="events" role="log"></div><div id="asks"></div><h2>재시작 승인</h2><div id="restarts"></div><textarea id="prompt" aria-label="운영 요청"></textarea><button id="send" disabled>보내기</button><button id="stop" disabled>중단</button>
<script>
const $=id=>document.getElementById(id);let bound=null,controller=null,epoch=0;
async function api(path,body){const r=await fetch(path,{method:body?'POST':'GET',headers:{Authorization:'Bearer '+$('token').value,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const text=await r.text();if(!r.ok)throw Error(text||'연결 실패');return JSON.parse(text)}
function clear(){epoch++;controller?.abort();bound=null;$('send').disabled=true;$('stop').disabled=true;$('asks').replaceChildren()}
function show(e){const p=e.data?.part;if(e.type==='part.appended'&&p){const row=document.createElement('pre');row.textContent=p.text??JSON.stringify(p.toolResult?.content??p,null,2);$('events').append(row);$('events').scrollTop=$('events').scrollHeight}if(e.type==='connection.error')$('status').textContent=e.message||'연결 실패';if(e.type==='permission.requested'||e.type==='question.requested'){const d=e.data,key={...bound},box=document.createElement('section'),text=document.createElement('pre');text.textContent=(d.question||d.name)+'\n'+JSON.stringify(d.args||d.report||{});box.append(text);const choices=e.type==='permission.requested'?['allow','deny']:(d.options||[]);for(const choice of choices){const b=document.createElement('button');b.textContent=choice;b.onclick=()=>answer(key,d.callId,e.type==='permission.requested'?{method:'permission',decision:choice}:{method:'reply',answer:choice},box);box.append(b)}if(e.type==='question.requested'){const input=document.createElement('input'),b=document.createElement('button');input.setAttribute('aria-label','질문 답변');b.textContent='답변';b.onclick=()=>answer(key,d.callId,{method:'reply',answer:input.value},box);box.append(input,b)}$('asks').append(box)}}
async function answer(key,callId,payload,box){try{if(!bound||key.session!==bound.session||key.binding!==bound.binding)throw Error('만료된 요청');await api('/api/request',{binding:key.binding,callId,...payload});box.remove()}catch(e){$('status').textContent=e.message}}
async function stream(key,version){controller=new AbortController();try{const r=await fetch('/api/events?binding='+encodeURIComponent(key.binding),{headers:{Authorization:'Bearer '+$('token').value},signal:controller.signal});if(!r.ok)throw Error('이벤트 연결 실패');const reader=r.body.getReader(),decoder=new TextDecoder();let pending='';while(version===epoch){const {done,value}=await reader.read();if(done)throw Error('대화 연결이 종료되었습니다. 다시 연결해 주세요.');pending+=decoder.decode(value,{stream:true});let at;while((at=pending.indexOf('\n\n'))>=0){const block=pending.slice(0,at);pending=pending.slice(at+2);for(const line of block.split('\n'))if(line.startsWith('data:')){const e=JSON.parse(line.slice(5));if(version===epoch&&(!e.sessionId||e.sessionId===key.session))show(e)}}}}catch(e){if(e.name!=='AbortError'&&version===epoch)$('status').textContent=e.message}}
$('connect').onclick=async()=>{clear();const version=epoch;try{const c=await api('/api/operations/config');const b=await api('/api/connect',{target:c.target});if(version!==epoch)return;bound=b;$('target').textContent=c.target+' · '+c.resources.join(', ');$('events').replaceChildren();$('send').disabled=false;$('stop').disabled=false;stream({...b},version)}catch(e){if(version===epoch)$('status').textContent=e.message}};
$('send').onclick=async()=>{const version=epoch,key=bound,text=$('prompt').value;try{await api('/api/request',{binding:key.binding,method:'say',text});if(version===epoch&&$('prompt').value===text)$('prompt').value=''}catch(e){$('status').textContent=e.message}};
$('stop').onclick=async()=>{try{await api('/api/request',{binding:bound.binding,method:'interrupt'})}catch(e){$('status').textContent=e.message}};window.addEventListener('pagehide',clear);
let restartBusy=false;
async function restartDecision(p,decision){if(restartBusy)return;if(decision==='allow'&&!confirm('재시작할까요?\n환경: '+p.environment+'\n대상: '+p.resource+'\n영향: '+p.impact+'\n복구: '+p.recovery))return;restartBusy=true;$('status').textContent='재시작 요청을 처리하고 있습니다.';try{const out=await api('/api/operations/decision',{id:p.id,decision});$('status').textContent=out.denied?'재시작을 거부했습니다.':out.executed===true&&out.verified?'재시작과 상태 확인이 완료됐습니다.':out.error||'상태 확인이 필요합니다.';const text=document.createElement('pre');text.textContent=JSON.stringify(out,null,2);$('events').append(text)}catch(e){$('status').textContent=e.message}finally{restartBusy=false;refreshRestarts()}}
async function refreshRestarts(){if(!bound||restartBusy)return;const version=epoch;try{const rows=await api('/api/operations/pending');if(version!==epoch)return;$('restarts').replaceChildren();for(const p of rows){const box=document.createElement('section'),text=document.createElement('pre');text.textContent='환경: '+p.environment+'\n대상: '+p.resource+'\n영향: '+p.impact+'\n복구: '+p.recovery;box.append(text);for(const [decision,label] of [['allow','재시작 승인'],['deny','재시작 거부']]){const b=document.createElement('button');b.textContent=label;b.onclick=()=>restartDecision(p,decision);box.append(b)}$('restarts').append(box)}}catch(e){if(version===epoch)$('status').textContent=e.message}}
setInterval(refreshRestarts,2000);
</script></html>
