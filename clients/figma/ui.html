<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Magi Figma</title>
<style>body{font:13px system-ui;margin:12px;color:var(--figma-color-text,#222);background:var(--figma-color-bg,#fff)}input,textarea,button,select{font:inherit;box-sizing:border-box;max-width:100%}input,textarea{width:100%;margin:4px 0}textarea{min-height:70px}#events{height:230px;overflow:auto;white-space:pre-wrap;border:1px solid #888;padding:8px}#status{white-space:pre-wrap}button{margin:4px}label{display:block}fieldset{border:1px solid #888}#approval{display:none}</style>
<h2>Magi</h2><p id="status" role="status">파일 정보를 기다립니다.</p>
<label>로컬 헬퍼 주소<input id="endpoint" value="http://127.0.0.1:8734"></label><label>로컬 연결 토큰<input id="token" type="password" autocomplete="off"></label>
<label>파일 키가 없을 때 사용할 문서 ID<input id="document-id" placeholder="이 파일 전용 ID (8자 이상)"></label>
<button id="connect" disabled>연결</button><button id="disconnect" disabled>연결 종료</button><button id="new-session" disabled>새 세션</button>
<label>모델<input id="model" placeholder="모델 이름"></label><button id="set-model" disabled>모델 변경</button>
<div id="events" role="log" aria-label="대화"></div>
<fieldset id="approval"><legend>승인 요청</legend><pre id="ask"></pre><button data-decision="allow">허용</button><button data-decision="deny">거부</button><label>답변<input id="answer"></label><button id="reply">답변 보내기</button></fieldset>
<label>요청<textarea id="text"></textarea></label><button id="send" disabled>보내기</button>
<script>
(()=>{'use strict';let context=null,binding=null,ask=null,controller=null,epoch=0,eventEpoch=0,session=null,lease=null,releasePromise=Promise.resolve();const pending=new Map();const $=id=>document.getElementById(id);const status=s=>$('status').textContent=s;
const append=s=>{const e=$('events');const bottom=e.scrollHeight-e.scrollTop-e.clientHeight<24;const p=document.createElement('div');p.textContent=s;e.append(p);while(e.children.length>200)e.firstChild.remove();if(bottom)e.scrollTop=e.scrollHeight};
function base(){const u=new URL($('endpoint').value);if(u.protocol!=='http:'||!['localhost','127.0.0.1'].includes(u.hostname)||u.username||u.password||u.pathname!=='/'||u.search||u.hash)throw Error('localhost 또는 127.0.0.1의 HTTP 주소를 입력해 주세요.');return u.origin;}
async function api(path,body,signal){if(!$('token').value)throw Error('로컬 연결 토큰이 필요합니다.');const r=await fetch(base()+path,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+$('token').value},body:JSON.stringify(body),signal});const data=await r.json();if(!r.ok)throw Error(data.error||'로컬 헬퍼 요청 실패 ('+r.status+')');return data;}
function active(on){for(const id of ['send','new-session','set-model','disconnect'])$(id).disabled=!on;}
function release(old){if(!old)return releasePromise;const task=fetch(old.base+'/api/disconnect',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+old.token},body:JSON.stringify({binding:old.binding}),keepalive:true}).then(r=>{if(!r.ok)throw Error('기존 연결 해제에 실패했습니다. 헬퍼를 다시 시작해 주세요.');});releasePromise=Promise.all([releasePromise.catch(()=>{}),task]).then(()=>{});releasePromise.catch(()=>{});return releasePromise;}
function stop(){parent.postMessage({pluginMessage:{kind:'session',session:null}},'*');const old=lease;lease=null;epoch++;eventEpoch++;session=null;controller?.abort();controller=null;binding=null;ask=null;pending.clear();active(false);$('approval').style.display='none';return release(old);}
async function request(method,extra={}){if(!binding)throw Error('먼저 연결해 주세요.');return api('/api/request',{binding,method,...extra},controller?.signal);}
async function relay(ticket){const version=epoch;try{while(binding&&version===epoch){const data=await api('/api/figma/poll',{binding},controller.signal);if(!data.callId)continue;if(data.session!==session)continue;if(pending.size>=32)throw Error('처리 대기 도구가 너무 많습니다. 다시 연결해 주세요.');if(typeof data.callId!=='string'||typeof data.name!=='string'||!data.args||typeof data.args!=='object'||Array.isArray(data.args))throw Error('잘못된 도구 요청입니다.');if(!context||context.fileKey!==ticket.fileKey)throw Error('파일이 변경되었습니다. 다시 연결해 주세요.');if(pending.has(data.callId))throw Error('중복 도구 호출 ID입니다.');pending.set(data.callId,{binding,version,session:data.session});parent.postMessage({pluginMessage:{kind:'tool',...data,fileKey:ticket.fileKey,pageId:context.pageId,selectionIds:context.selection.map(n=>n.id)}},'*');}}catch(e){if(e.name!=='AbortError'&&version===epoch){status(e.message);stop();}}}
window.onmessage=async event=>{if(event.source!==parent)return;const m=event.data?.pluginMessage;if(!m||typeof m!=='object'||Array.isArray(m))return;if(m.kind==='context'&&typeof m.pageId==='string'&&Array.isArray(m.selection)&&Array.isArray(m.tools)){if(context&&context.fileKey!==m.fileKey){stop();status('파일이 변경되었습니다. 다시 연결해 주세요.');}context=m;$('connect').disabled=false;if(!m.fileKey)status('파일 키가 없습니다. 이 파일에만 사용할 영속 문서 ID를 입력해 주세요.');else if(!binding)status('파일 '+m.fileKey+' · 연결할 수 있습니다.');}else if(m.kind==='tool-result'&&typeof m.callId==='string'){const p=pending.get(m.callId);if(!p||p.version!==epoch||p.session!==session)return;pending.delete(m.callId);try{await api('/api/figma/result',{binding:p.binding,session:p.session,callId:m.callId,...(typeof m.error==='string'?{error:m.error}:{result:m.result})},controller.signal);}catch(e){status(e.message);}}};
$('connect').onclick=async()=>{try{await stop();}catch(e){status(e.message);return;}if(!context)return;if(!context.fileKey){const id=$('document-id').value;if(!/^[A-Za-z0-9_-]{8,128}$/.test(id)){status('문서 ID는 영문·숫자·밑줄·하이픈 8~128자로 입력해 주세요. 다른 파일과 공유하면 안 됩니다.');return;}context={...context,fileKey:'local:'+id};parent.postMessage({pluginMessage:{kind:'bind',documentId:id}},'*');}const ticket={...context};controller=new AbortController();const version=epoch;try{const data=await api('/api/connect',{target:'figma:'+ticket.fileKey},controller.signal);if(version!==epoch){if(typeof data.binding==='string')release({binding:data.binding,base:base(),token:$('token').value});return;}if(typeof data.binding!=='string'||!data.binding)throw Error('헬퍼가 올바른 연결 ID를 반환하지 않았습니다.');binding=data.binding;lease={binding,base:base(),token:$('token').value};session=data.session;parent.postMessage({pluginMessage:{kind:'session',session}},'*');active(true);status('연결됨 · 세션 '+data.session);relay(ticket);events(version,++eventEpoch);}catch(e){if(e.name!=='AbortError'){status(e.message);stop();}}};
function clearAsk(){ask=null;$('approval').style.display='none';$('answer').value='';}
function render(e){const d=e.data;if(!d||typeof d!=='object')return;
 if(e.type==='part.appended'&&d.part&&typeof d.part==='object'){const p=d.part;if(typeof p.text==='string')append((d.role||'assistant')+': '+p.text);else if(p.toolResult)append('도구 결과: '+JSON.stringify(p.toolResult.content));else if(p.error)append('오류: '+p.error);}
 else if(e.type==='permission.requested'||e.type==='question.requested'){if(typeof d.callId!=='string'||!d.callId)return;ask={...d,kind:e.type};$('ask').textContent=e.type==='permission.requested'?'승인: '+d.name+'\n'+JSON.stringify(d.args,null,2)+(d.reason?'\n'+d.reason:''):(d.question||'질문')+(Array.isArray(d.options)?'\n'+d.options.join('\n'):'');for(const b of document.querySelectorAll('[data-decision]'))b.hidden=e.type!=='permission.requested';$('reply').hidden=e.type!=='question.requested';$('answer').parentElement.hidden=e.type!=='question.requested';$('approval').style.display='block';}
 else if((e.type==='permission.decided'||e.type==='question.answered')&&ask?.callId===d.callId)clearAsk();
 else if(e.type==='error')append('오류: '+(d.message||JSON.stringify(d)));
}
async function events(version,streamVersion){try{let since=0;const boundSession=session;while(binding&&version===epoch&&streamVersion===eventEpoch){const d=await api('/api/figma/events',{binding,since},controller.signal);if(version!==epoch||streamVersion!==eventEpoch)return;if(!Array.isArray(d.events)||d.events.length>200)throw Error('잘못된 이벤트 응답입니다.');for(const e of d.events){if(!e||typeof e!=='object')throw Error('잘못된 이벤트입니다.');if(e.sessionId&&e.sessionId!==boundSession)continue;if(typeof e.seq==='number')since=Math.max(since,e.seq);render(e);}}}catch(e){if(e.name!=='AbortError'&&version===epoch&&streamVersion===eventEpoch)status(e.message);}}
const guarded=fn=>async()=>{try{await fn()}catch(e){status(e.message)}};
$('disconnect').onclick=async()=>{try{await stop();status('연결을 종료했습니다.');}catch(e){status(e.message);}};$('send').onclick=guarded(async()=>{const text=$('text').value;if(!text.trim())return;await request('say',{text});$('text').value='';});$('new-session').onclick=guarded(async()=>{const previous=session;session=null;parent.postMessage({pluginMessage:{kind:'session',session:null}},'*');let data;try{data=await request('new');}catch(e){session=previous;parent.postMessage({pluginMessage:{kind:'session',session}},'*');throw e;}if(typeof data.session!=='string')throw Error('새 세션 ID가 없습니다.');session=data.session;pending.clear();parent.postMessage({pluginMessage:{kind:'session',session}},'*');clearAsk();$('events').replaceChildren();status('연결됨 · 세션 '+session);events(epoch,++eventEpoch);});$('set-model').onclick=guarded(()=>request('model',{name:$('model').value}));for(const b of document.querySelectorAll('[data-decision]'))b.onclick=guarded(async()=>{if(!ask)return;await request('answer',{callId:ask.callId,decision:b.dataset.decision});$('approval').style.display='none';ask=null;});$('reply').onclick=guarded(async()=>{if(!ask)return;await request('reply',{callId:ask.callId,answer:$('answer').value});$('approval').style.display='none';ask=null;});window.addEventListener('pagehide',()=>{stop();});parent.postMessage({pluginMessage:{kind:'ready'}},'*');})();
</script></html>
