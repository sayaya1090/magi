# 플러그인이 magi 코어를 어디서 어느 판으로 받아오는가. **코드에 안 박는다** — 저장소를 옮기거나
# 사내 미러를 쓰는 사람이 코틀린을 고치지 않고 이 파일만 갈아 끼울 수 있어야 한다.
#
# `{version}` `{os}` `{arch}` `{ext}` 가 채워진다. 이름 규약은 코어 릴리스가 이미 쓰는 것이고
# (goreleaser 자산), 자기업데이트도 같은 이름을 읽는다 — 여기서 새 규약을 만들지 않는다.
core.version=0.29.0
core.asset=magi_{os}_{arch}.{ext}
core.url=https://github.com/sayaya1090/magi/releases/download/v{version}/{asset}
core.checksums=https://github.com/sayaya1090/magi/releases/download/v{version}/checksums.txt

# 사내 미러가 사설 CA 로 서 있어 인증서 검증이 막을 때만 `true`. **기본은 꺼짐이다.**
# 켜면 이 두 주소에 한해 인증서와 호스트 이름을 안 따지고, **체크섬도 아예 확인하지 않는다.**
# 체크섬 표가 같은 연결로 오는 이상 중간에 있는 쪽이 파일과 표를 둘 다 바꿀 수 있어서, 그때의
# sha256 은 보장처럼 보이기만 한다 — 약한 검사는 없는 검사보다 나쁘다. 켜져 있으면 받기 전
# 대화가 그 사실을 사람에게 적는다.
# 평문 http 는 이 값과 무관하게 안 받는다.
core.insecure=false
