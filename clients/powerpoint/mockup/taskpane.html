<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>magi — PowerPoint 목업</title>
  <link rel="stylesheet" href="taskpane.css" />
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <!--
    헬퍼가 이 자리에 부팅 값을 심는다(`helper/page.go` 의 `tokenMarker`). 토큰이 **페이지에
    박혀 나오는 것**이고 주소는 이 페이지의 자기 오리진이라, 「어떻게 도달하는가」가 통째로
    사라진다(DESIGN.md §5.5·§12 #7).

    맨 브라우저로 열면 이 주석은 그대로 남고 `window.MAGI` 가 없다 — 그때는 가짜로 돈다.
    **조용히 진짜인 척하지 않는 것**이 이 갈래의 요점이다.
  -->
  <!--magi:boot-->
</head>
<body>
  <!-- 목업에서만 보인다. 애드인 안에서는 PowerPoint 가 이 자리다. -->
  <section id="fake"></section>

  <section id="pane">
    <header>
      <strong>magi</strong>
      <span id="adapter" class="adapter"></span>
    </header>

    <!--
      **이 판이 무엇인가.** 어느 호스트에 붙었는지, 못 붙었으면 왜인지. 누름의 결과인 아래
      `#note` 와 자리를 나눈다 — 한 칸을 같이 쓰면 첫 누름이 이 사실을 지우고(그 뒤로는
      PowerPoint 안이 아니라는 걸 영영 알 수 없다), 반대로 이 사실이 누름의 사유를 덮는다.
      수명이 다르다: 이건 창이 사는 동안 계속 참이고, 저건 이번 한 번의 일이다.
    -->
    <div id="where" class="where" hidden></div>

    <div id="caps" class="caps"></div>

    <!--
      **붙을 곳은 애드인이 고른다**(DESIGN.md §5.0). 켜진 컴패니언 중에서 사람이 하나를 고르고,
      못 고르는 것은 **이유와 함께** 못 고르게 둔다 — 고르는 순간 「이 컴패니언 됩니다」라고 말한
      것이 되므로 거절이 그 뒤에 도착하면 늦다(§5.0.5).
    -->
    <section id="pick" class="pick" hidden></section>

    <!-- 스트림 자체에 대한 말. 대화가 조용한 것과 스트림이 죽은 것은 화면에서 똑같이 생겼다. -->
    <div id="stream" class="stream" hidden></div>

    <div id="turns" class="turns"></div>

    <!-- 이 창이 그릴 줄 몰라 안 그린 것. 안 그린 것과 없는 것은 다르다
         (clients/powerpoint/DESIGN.md §5.7). -->
    <div id="unknown" class="unknown-note" hidden></div>

    <!-- 냈는데 아직 로그에 안 뜬 것. 「생각 중…」이 아니다 — 짐작을 안 적는다. -->
    <div id="sent" class="sent" hidden></div>
    <!--
      데몬이 스스로 말하는 「지금 하는 일」. 이건 짐작이 아니라 status 가 말한 사실이다 —
      **방금 읽었을 때만.** 못 닿는 동안엔 근거가 없어지므로 현재형을 버리고 「마지막으로
      읽었을 때」로 적는다(`WatchPrompt` 의 `doingFresh`).
    -->
    <div id="doing" class="doing" hidden></div>

    <div id="advice-wrap" class="advice-wrap" hidden>
      <h2>안내</h2>
      <p class="advice-note">누르면 그 도형을 잡습니다. 저절로 움직이지는 않습니다.</p>
      <!-- 붙이려다 못 붙인 것. 안 붙은 이유가 어디엔가 있어야 한다
           (clients/powerpoint/DESIGN.md §5.7). -->
      <p id="advice-strays" class="advice-strays" hidden></p>
      <div id="advice"></div>
    </div>

    <!-- **이번 한 번의 일.** 방금 누른 것이 어떻게 됐는지. 다음 누름이 물린다(`View.guard`).
         이 판이 무엇인가는 위 `#where` 가 말한다. -->
    <div id="note" class="note" hidden></div>

    <!--
      데몬이 막혀서 묻고 있는 자리. 대화창과 **다른 흐름**이다 — 물음은 로그에 안 쌓이고
      막힌 데몬의 버스로만 나가므로 스트림으로는 영영 안 온다
      (clients/powerpoint/DESIGN.md §5.7). 이 자리가
      없으면 §6의 안전 규칙이 사람을 가둔다: 데몬은 답을 기다리고, 사람은 물음을 못 본다.
    -->
    <section id="ask" class="ask" hidden></section>

    <div class="composer">
      <div id="pending" class="pending"></div>
      <textarea id="input" rows="2" placeholder="시킬 말을 적습니다 (⌘Enter 로 보내기)"></textarea>
      <div class="buttons">
        <button id="quote" class="ghost"
          title="지금 잡혀 있는 도형을 인용에 담습니다">⌸ 선택 인용</button>
        <button id="send" class="primary">보내기</button>
      </div>
    </div>
  </section>

  <script type="module" src="src/main.js"></script>
</body>
</html>
