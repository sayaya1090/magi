<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>magi — a coding agent that is not allowed to declare itself finished</title>
<meta name="description" content="A terminal coding agent whose turn ends only when the agent declares it is done and three council members accept that declaration by reading the record of what actually ran.">
<meta property="og:title" content="magi">
<meta property="og:description" content="A coding agent that is not allowed to declare itself finished. Three council members read the record — not the agent's summary — before a turn may end.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://sayaya1090.github.io/magi/">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="landing.css">
<!-- rxjs 를 먼저 창에 올린다 — 콘솔의 스토어 밑감(bridge/Told)이 그 위에 살고, 이 페이지의
     말 고르개도 같은 밑감을 쓴다. 모듈 스크립트는 실행 순서가 보장되므로 여기서 올린 뒤에
     GWT 부트스트랩을 넣는다(콘솔의 시험 페이지와 같은 차례). -->
<script type="module">
  import * as rxjs from './vendor/rxjs.js';
  window.rxjs = rxjs;
  const boot = document.createElement('script');
  boot.src = 'landing/landing.nocache.js';
  document.head.append(boot);
</script>
</head>
<body>
<div id="app">
  <!-- 스크립트가 도착하기 전까지, 그리고 아예 켜지 않은 사람에게 — 이 페이지가 무엇을 말하러
       있는지. 크롤러가 읽는 것도 이 글이다. -->
  <noscript id="plain">
    <h1>magi</h1>
    <p>A coding agent that is not allowed to declare itself finished.</p>
    <p>In most agent loops the turn ends when the model stops calling tools. magi ends it
      differently: the agent has to declare that it is done, and three council members read the
      record — what actually ran, how it really exited, what changed on disk — before that
      declaration is accepted.</p>
    <p>스스로 「다 했다」고 말할 수 없는 코딩 에이전트. 에이전트가 끝났다고 선언해야 하고, 세
      위원이 기록을 읽은 뒤에야 그 선언이 받아들여진다.</p>
    <p><a href="https://github.com/sayaya1090/magi">GitHub</a> ·
       <a href="https://github.com/sayaya1090/magi/blob/main/docs/MANUAL.md">Manual</a> ·
       <a href="demo/">Console demo</a></p>
  </noscript>
</div>
</body>
</html>
