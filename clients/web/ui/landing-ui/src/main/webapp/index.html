<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>magi — a persistent coding agent that never drops work when you close the window or switch tools</title>
<meta name="description" content="A persistent Go AI coding agent that runs as an independent resident daemon per workspace. Connect seamlessly from terminal TUIs, web consoles, and IDEs with event-sourced logs and council consensus verification.">
<meta property="og:title" content="magi">
<meta property="og:description" content="A persistent Go AI coding agent that never drops work when you close the window or switch tools. Independent resident daemons, event-sourced time travel, and 3-member council consensus verification.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://sayaya1090.github.io/magi/">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="landing.css">
<!-- rxjs 를 먼저 창에 올린다 — 콘솔의 스토어 밑감(bridge/Told)이 그 위에 살고, 이 페이지의
     말 고르개도 같은 밑감을 쓴다. 모듈 스크립트는 실행 순서가 보장되므로 여기서 올린 뒤에
     GWT 부트스트랩을 넣는다(콘솔의 시험 페이지와 같은 차례). -->
<script type="module">
  import * as rxjs from './vendor/rxjs.js';
  window.rxjs = rxjs;
  const boot = document.createElement('script');
  boot.src = 'landing/landing.nocache.js';
  document.head.append(boot);
</script>
</head>
<body>
<div id="app">
  <!-- 스크립트가 도착하기 전까지, 그리고 아예 켜지 않은 사람에게 — 이 페이지가 무엇을 말하러
       있는지. 크롤러가 읽는 것도 이 글이다. -->
  <noscript id="plain">
    <h1>magi</h1>
    <p>A persistent coding agent that never drops work when you close the window or switch tools.</p>
    <p>Runs as an independent resident daemon per workspace, allowing terminal TUIs, web consoles, and IDEs (VS Code, JetBrains, Visual Studio) to attach and detach seamlessly over local sockets. Every turn is event-sourced into an append-only JSONL log, while a 3-member council consensus gate prevents premature and unverified completion.</p>
    <p>창을 닫아도, 도구를 바꿔도 작업이 끊기지 않는 상주형 코딩 에이전트. 워크스페이스마다 독립 데몬으로 상주하며 터미널, 웹 콘솔, IDE 어디서든 소켓으로 자유롭게 연결됩니다. 모든 작업은 추가 전용 JSONL 로그로 이벤트 소싱되며, 3인 카운슬 검증 게이트가 거짓 완료를 원천 차단합니다.</p>
    <p><a href="https://github.com/sayaya1090/magi">GitHub</a> ·
       <a href="https://github.com/sayaya1090/magi/blob/main/docs/MANUAL.md">Manual</a> ·
       <a href="demo/">Console demo</a></p>
  </noscript>
</div>
</body>
</html>
