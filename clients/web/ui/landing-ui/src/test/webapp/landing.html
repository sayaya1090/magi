<!DOCTYPE html>
<html>
<head>
    <title>landing</title>
    <link rel="stylesheet" href="css/landing.css">
    <!-- devMode 로 이 페이지를 여는 자리 — 사이트의 index.html 과 같은 차례로 싣는다(rxjs 먼저).
         플러그인이 만들어 둔 기본 페이지는 그 줄이 없어서 스토어가 설 자리가 없었다. -->
    <script type="module">
      import * as rxjs from './js/rxjs.js';
      window.rxjs = rxjs;
      const boot = document.createElement('script');
      boot.src = 'landing/landing.nocache.js';
      document.head.append(boot);
    </script>
</head>
<body><div id="app"></div></body>
</html>
