name: CI

on:
  push:
    branches: [main]
    # The new console (web/) and the editor clients (clients/) test on their own clocks —
    # test-web.yml, test-jetbrains.yml — the way they release on their own clocks. A push that
    # only touches one of them has nothing here to prove.
    paths-ignore:
      - "web/**"
      - "clients/**"
  pull_request:
    paths-ignore:
      - "web/**"
      - "clients/**"

permissions:
  contents: write # the coverage-badge step pushes a JSON to the 'badges' branch

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      # clients/jetbrains/README.md cites Go symbols by name. It rots when THIS side renames
      # something, and this is the lane that runs when this side changes — test-jetbrains.yml
      # only fires on clients/jetbrains/**, so it would never see the rename that broke the doc.
      # That is not hypothetical: thirteen citations went stale in one day and nothing said so.
      - name: the jetbrains doc still points at symbols that exist
        run: python3 clients/jetbrains/tools/citecheck.py

      - name: build
        run: go build ./...

      - name: test (race + coverage)
        # Live Ollama Cloud E2E tests are skipped (-skip E2E), so CI stays hermetic.
        #
        # MAGI_FUZZ_SEEDS narrows the TUI random walk here. The walk's twenty baseline seeds cost
        # ~33s each under -race — 11 minutes for that one test — and it blew the default 10m
        # per-package timeout with a panic that named no test. What -race needs from the walk is
        # the race detector over the view's code, which one seed already gives; what twenty seeds
        # give is SEQUENCE coverage, and that does not need the detector. The full baseline still
        # runs everywhere the variable is unset.
        #
        # -timeout is explicit so a slow package fails saying so, instead of panicking at a
        # default nobody chose.
        env:
          MAGI_FUZZ_SEEDS: "7717,7723,7727,7741"
        run: |
          set -o pipefail
          go test -race -timeout 15m -covermode=atomic -coverprofile=coverage.out -skip E2E ./... | tee test-output.txt

      - name: coverage summary
        if: always()
        run: |
          {
            echo "## 🧪 Test coverage"
            echo ""
            if [ -f coverage.out ]; then
              # internal/eval is a manual, env-gated benchmark harness (its tests skip
              # without MAGI_EVAL_*), not unit-tested production code — exclude it from
              # the coverage tally so it doesn't drag the total/badge down.
              grep -v '/internal/eval/' coverage.out > coverage.prod.out
              # …and drop the functions marked //coverage:ignore: the process entry
              # point and the one-line adapters no test can assert anything about. The
              # marker carries its reason at the function, and covignore fails the step
              # if one has gone stale (something now covers it, or the name drifted).
              go run ./tools/covignore -i coverage.prod.out -o coverage.filtered.out \
                -bypkg coverage.bypkg.tsv
              mv coverage.filtered.out coverage.prod.out
              total=$(go tool cover -func=coverage.prod.out | tail -1 | awk '{print $NF}')
              echo "### Total: \`${total}\`"
              echo ""
              echo "| Package | Coverage | |"
              echo "|---|---:|:--|"
              # The rows are aggregated from the SAME filtered profile as the total above.
              # They used to come from `go test`'s own per-package line, which is printed
              # before any filtering runs — so the marked functions came off the total and
              # stayed on the rows, and cmd/magi read 50% underneath a total that had
              # already excluded its entry point. Only packages the profile names appear,
              # which is exactly the set that has tests: no test binary, no blocks. A
              # tested package that is genuinely 0% (a real gap) is kept.
              # Lowest coverage first, with a 🟥/🟨/🟩 status (<50 / <80 / ≥80).
              sed -E 's#github.com/sayaya1090/magi/##' coverage.bypkg.tsv \
                | awk -F'\t' '{
                    p=$4
                    e="🟥"; if (p+0>=80) e="🟩"; else if (p+0>=50) e="🟨"
                    printf "%06.2f\t| `%s` | %s%% | %s |\n", p+0, $1, p, e
                  }' \
                | sort -n | cut -f2-
            else
              echo "_no coverage profile was produced_"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: upload coverage profile
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: ignore

      # Publish a shields.io endpoint badge (coverage %) to an orphan 'badges'
      # branch using the default token — no third-party service or extra secret.
      # Runs only on main; the README badge reads badges/coverage.json.
      - name: publish coverage badge
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Exclude the env-gated internal/eval benchmark harness from the badge %.
          grep -v '/internal/eval/' coverage.out > coverage.prod.out
          pct=$(go tool cover -func=coverage.prod.out | tail -1 | awk '{print $NF}' | tr -d '%')
          color=e05d44
          awk "BEGIN{exit !($pct>=80)}" && color=4c1 || awk "BEGIN{exit !($pct>=60)}" && color=dfb317
          tmp=$(mktemp -d)
          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' "$pct" "$color" > "$tmp/coverage.json"
          cd "$tmp"
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coverage.json
          git commit -q -m "coverage: ${pct}%"
          git branch -M badges
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges
