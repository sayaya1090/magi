name: CI

on:
  push:
    branches: [main]
    # The console's UI and the editor clients test on their own clocks — test-web.yml,
    # test-jetbrains.yml — the way they release on their own clocks. A push that only touches one
    # of them has nothing here to prove.
    #
    # Listed one by one rather than as "clients/**", because the console's SERVER lives under
    # clients/ now (clients/web/server) and it is Go: this is the workflow that builds, vets and
    # tests Go, and a blanket ignore would have quietly taken it out of that.
    paths-ignore:
      - "clients/jetbrains/**"
      - "clients/powerpoint/**"
      - "clients/web/ui/**"
  pull_request:
    paths-ignore:
      - "clients/jetbrains/**"
      - "clients/powerpoint/**"
      - "clients/web/ui/**"

permissions:
  contents: write # the coverage-badge step pushes a JSON to the 'badges' branch

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          # Tracked files only, so this command means the same thing here and on a developer's
          # machine. `gofmt -l .` walks the working tree, and a checkout has scratchpad/ and the
          # local-only plugins in it — three unformatted files that are not the repository's and
          # never will be. Anyone who ran the CI command locally got a red answer every time and
          # learned to ignore it, which is how an unformatted test file reached main and turned
          # this step red 23 seconds into the run.
          unformatted=$(git ls-files -z '*.go' | xargs -0 gofmt -l)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"; echo "$unformatted"; exit 1
          fi

      # PowerShell 스크립트는 **파싱이라도 한다**.
      #
      # install.ps1 은 630줄이고 사람이 한 번 돌려 Office 를 까는 물건인데, 이 저장소에서 그것을 읽는
      # 것이 아무것도 없었다 — 문법 오류 하나가 「관리자 창에서 반쯤 깔리다 멈춤」으로만 드러난다.
      # 여기서 재는 것은 파싱뿐이지만(도는 것은 Windows + Office 가 있어야 안다), 파싱은 사람이
      # 돌리기 전에 알 수 있는 유일한 사실이다. ubuntu 러너에 pwsh 가 이미 있다.
      - name: powershell parses
        shell: pwsh
        run: |
          $bad = 0
          foreach ($f in (git ls-files '*.ps1')) {
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $f), [ref]$null, [ref]$errs) | Out-Null
            if ($errs.Count) {
              $bad = 1
              Write-Host "$f"
              $errs | ForEach-Object { Write-Host ("  {0}행: {1}" -f $_.Extent.StartLineNumber, $_.Message) }
            }
          }
          if ($bad) { exit 1 } else { Write-Host "ps1 parse ok" }

      - name: shell scripts parse and check
        # The .ps1 gate above has had no counterpart for shell, while scripts/install.sh is the
        # script people run as `curl … | sh` — the least reviewed and most executed file here.
        #
        # Two passes, because they catch different things. `sh -n` is the shell's own parser and
        # answers "would this even run"; shellcheck answers "does it do what it looks like".
        # Severity starts at warning: the note level is mostly style and it has false positives on
        # this tree (a JSON `\n` inside single quotes is not an echo escape).
        #
        # What it would NOT have caught, measured rather than assumed: install.sh broke on
        # 2026-09-08 because under `set -e` an assignment from a failing command ends the script AT
        # the assignment, so the error message written for that case had never once printed.
        # shellcheck is silent on that at every severity, and so is `sh -n`. This gate is for
        # syntax and the ordinary shellcheck classes; it is not a claim to have covered that one.
        #
        # shellcheck ships on the ubuntu runner image (checked against the runner-images manifest,
        # 2026-09-08). If a later image drops it the step fails with 127 rather than passing on a
        # command that never ran, which is the direction this has to fail in.
        run: |
          set -o pipefail
          bad=0
          files=$(git ls-files '*.sh' | grep -v '^scratchpad/')
          [ -n "$files" ] || { echo "no shell scripts found — this step is checking nothing"; exit 1; }
          printf '%s\n' "$files" | xargs -n1 sh -n || bad=1
          printf '%s\n' "$files" | xargs shellcheck -S warning -f gcc || bad=1
          if [ "$bad" != 0 ]; then exit 1; fi
          echo "shell ok: $(printf '%s\n' "$files" | wc -l | tr -d ' ') scripts"

      - name: go vet
        run: go vet ./...

      - name: build
        run: go build ./...

      - name: windows cross-build and vet
        # The lane above is ubuntu-latest and nothing else, so until this step existed every
        # `//go:build windows` file in the tree was never compiled by CI at all. Fifteen of them,
        # and four with a windows-only test beside them. `internal/atomicfile/rename_windows.go` went
        # in at ninety-two lines with neither: "CI is green" said nothing whatever about it.
        #
        # Cross-compiling is what a ubuntu runner can honestly do here: `go test` needs to RUN the
        # binary and cannot. So this measures compilation and vet only — which was zero.
        run: |
          GOOS=windows go build ./...
          GOOS=windows go vet ./...

      - name: test (race + coverage)
        # Live Ollama Cloud E2E tests are skipped (-skip E2E), so CI stays hermetic.
        #
        # MAGI_FUZZ_SEEDS narrows the TUI random walk here, and the narrowing matters far more
        # than the number below it used to say. What -race needs from the walk is the race
        # detector over the view's code, which one seed already gives; what twenty seeds give is
        # SEQUENCE coverage, and that does not need the detector. The full baseline still runs
        # everywhere the variable is unset.
        #
        # The old figure here — "~33s each, 11 minutes for that one test" — was measured while
        # every seed was dying at about step 34 of 500: the picker step skipped for want of a
        # session list, and t.Skip ends the whole subtest. So it timed a walk that was not
        # happening. Re-measured after that was fixed, same four seeds, -race, on a 2026 laptop:
        # 2.6s before, 88.4s after — thirty-four times the cost, and the package as a whole goes
        # from a few seconds to 148s. A runner is slower again, so twenty seeds under -race would
        # now be a quarter of an hour for one test and would blow the timeout below rather than
        # merely stretch it. Widening this list is not a small edit; measure it first.
        #
        # -timeout is explicit so a slow package fails saying so, instead of panicking at a
        # default nobody chose.
        env:
          MAGI_FUZZ_SEEDS: "7717,7723,7727,7741"
        run: |
          set -o pipefail
          go test -race -timeout 15m -covermode=atomic -coverprofile=coverage.out -skip E2E ./... | tee test-output.txt

      - name: coverage summary
        if: always()
        run: |
          {
            echo "## 🧪 Test coverage"
            echo ""
            if [ -f coverage.out ]; then
              # internal/eval is a manual, env-gated benchmark harness (its tests skip
              # without MAGI_EVAL_*), not unit-tested production code — exclude it from
              # the coverage tally so it doesn't drag the total/badge down.
              grep -v '/internal/eval/' coverage.out > coverage.prod.out
              # …and drop the functions marked //coverage:ignore: the process entry
              # point and the one-line adapters no test can assert anything about. The
              # marker carries its reason at the function, and covignore fails the step
              # if one has gone stale (something now covers it, or the name drifted).
              go run ./tools/covignore -i coverage.prod.out -o coverage.filtered.out \
                -bypkg coverage.bypkg.tsv
              mv coverage.filtered.out coverage.prod.out
              total=$(go tool cover -func=coverage.prod.out | tail -1 | awk '{print $NF}')
              echo "### Total: \`${total}\`"
              echo ""
              echo "| Package | Coverage | |"
              echo "|---|---:|:--|"
              # The rows are aggregated from the SAME filtered profile as the total above.
              # They used to come from `go test`'s own per-package line, which is printed
              # before any filtering runs — so the marked functions came off the total and
              # stayed on the rows, and cmd/magi read 50% underneath a total that had
              # already excluded its entry point. Only packages the profile names appear,
              # which is exactly the set that has tests: no test binary, no blocks. A
              # tested package that is genuinely 0% (a real gap) is kept.
              # Lowest coverage first, with a 🟥/🟨/🟩 status (<50 / <80 / ≥80).
              sed -E 's#github.com/sayaya1090/magi/##' coverage.bypkg.tsv \
                | awk -F'\t' '{
                    p=$4
                    e="🟥"; if (p+0>=80) e="🟩"; else if (p+0>=50) e="🟨"
                    printf "%06.2f\t| `%s` | %s%% | %s |\n", p+0, $1, p, e
                  }' \
                | sort -n | cut -f2-
            else
              echo "_no coverage profile was produced_"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: upload coverage profile
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: ignore

      # Publish a shields.io endpoint badge (coverage %) to an orphan 'badges'
      # branch using the default token — no third-party service or extra secret.
      # Runs only on main; the README badge reads badges/coverage.json.
      - name: publish coverage badge
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Exclude the env-gated internal/eval benchmark harness from the badge %.
          grep -v '/internal/eval/' coverage.out > coverage.prod.out
          pct=$(go tool cover -func=coverage.prod.out | tail -1 | awk '{print $NF}' | tr -d '%')
          color=e05d44
          awk "BEGIN{exit !($pct>=80)}" && color=4c1 || awk "BEGIN{exit !($pct>=60)}" && color=dfb317
          tmp=$(mktemp -d)
          cd "$tmp"
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # Onto what is there, not over it. This used to build an orphan branch holding one file
          # and force-push it, which was fine while coverage.json was the only thing on badges —
          # and the moment the release train started publishing core-latest.txt beside it, every
          # push from main would have deleted that file until the next release put it back.
          git fetch -q --depth 1 origin badges && git checkout -q -B badges FETCH_HEAD || git checkout -q -B badges
          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' "$pct" "$color" > coverage.json
          git add coverage.json
          git commit -q -m "coverage: ${pct}%" || exit 0
          for try in 1 2 3; do
            git push -q origin badges && exit 0
            # Somebody else wrote to the branch between the fetch and the push — take theirs and
            # put ours back on top, which is safe because each writer owns one file.
            git fetch -q --depth 1 origin badges || break
            git checkout -q -B badges FETCH_HEAD
            printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' "$pct" "$color" > coverage.json
            git add coverage.json
            git commit -q -m "coverage: ${pct}%" || exit 0
          done
          exit 1
