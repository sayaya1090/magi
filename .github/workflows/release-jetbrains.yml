# The JetBrains plugin's own release lane. The core binary releases on v* tags through goreleaser
# and its asset layout is load-bearing (self-update pulls magi_<OS>_<arch> by name), so the plugin
# does not ride that train — the same reason web/ has its own. A jetbrains-v* tag releases the
# plugin zip alone, versioned on its own clock.
#
# The version comes from the tag and nowhere else. plugin.xml carries no <version>: two places to
# say one number is one place to forget.
name: release-jetbrains

on:
  push:
    tags:
      - "jetbrains-v*"

permissions:
  contents: write # gh release create uploads the asset

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5

      # Tests before the zip. A release that never ran the goldens is a release that cannot say
      # whether it still speaks the daemon's socket name.
      - name: test
        working-directory: clients/jetbrains/plugin
        run: ./gradlew :core:test --no-daemon

      # Does it actually run in the IDEs it claims? plugin.xml depends only on
      # com.intellij.modules.platform, which is SAID to mean every JetBrains IDE — but the
      # compile target is the IDEA SDK, so nothing had ever proved it. The verifier runs the
      # bytecode against each IDE in the sinceBuild range and fails on a call that is not there.
      #
      # Release lane only: it downloads ~1.7GB and takes ~6 minutes. A push should not pay that,
      # and what it catches (a class present in IDEA and absent in PyCharm) arrives with a code
      # change, not with a doc edit.
      #
      # Measured 2026-08-28 at IU-261, IU-262, PY-261: Compatible on all three, with 4 deprecated
      # and 6 experimental API usages that are NOT ours — Kotlin materialises ToolWindowFactory's
      # default methods when a Kotlin class implements that Java interface. The report is never
      # empty, so read the verdict line rather than the count.
      - name: it runs in more than IDEA
        working-directory: clients/jetbrains/plugin
        run: ./gradlew :intellij:verifyPlugin --no-daemon

      # 내부 API 사용은 **셈으로** 지킨다. 그 항목은 `verifyPlugin` 의 실패 수준에서 뺐는데,
      # 남은 둘이 우리가 쓴 것이 아니라 코틀린이 자바 인터페이스의 기본 메서드를 물질화하면서
      # 생긴 것이라 코드에서 지울 수가 없기 때문이다(사유는 intellij/build.gradle.kts).
      #
      # 그래서 게이트를 여는 대신 **여기로 옮긴다**: 지금 아는 둘보다 늘면 선다. 우리가 새로
      # 내부 API 를 쓰기 시작하면 이 자리가 운다. 판정문을 읽는 것이지 보고서를 뒤지지 않는다 —
      # 그 한 줄이 검증기가 스스로 세어 적는 수다.
      - name: no new internal API
        working-directory: clients/jetbrains/plugin
        run: |
          known=2
          worst=0
          shopt -s nullglob
          files=(intellij/build/reports/pluginVerifier/*/plugins/*/*/verification-verdict.txt)
          if [ ${#files[@]} -eq 0 ]; then
            echo "판정문을 못 찾았다 — 이 검사가 아무것도 안 보고 있다" >&2
            exit 1
          fi
          for f in "${files[@]}"; do
            ide=$(echo "$f" | cut -d/ -f5)
            # `grep -oE` 로 뽑는다. `sed` 의 `\?` 는 GNU 에서만 도는데, 그러면 이 검사가
            # 리눅스에서는 재고 맥에서는 **0 을 읽고 통과**한다 — 오늘 이 저장소가 커널 차이로
            # 같은 모양을 한 번 겪었다. 못 읽으면 통과가 아니라 실패다.
            n=$(grep -oE '[0-9]+ usages? of internal API' "$f" | grep -oE '^[0-9]+' || true)
            if [ -z "$n" ]; then
              echo "$ide: 판정문에서 내부 API 셈을 못 읽었다 — 형식이 바뀌었을 수 있다" >&2
              cat "$f" >&2
              exit 1
            fi
            echo "$ide: internal=$n"
            [ "$n" -gt "$worst" ] && worst=$n
          done
          if [ "$worst" -gt "$known" ]; then
            echo "내부 API 사용이 $known 개에서 $worst 개로 늘었다." >&2
            echo "우리가 새로 쓴 것이면 걷어낼 것. 컴파일러가 만든 것이면 known 을 올리고 사유를 적을 것." >&2
            exit 1
          fi

      - name: build
        working-directory: clients/jetbrains/plugin
        run: |
          version="${GITHUB_REF_NAME#jetbrains-v}"
          ./gradlew :intellij:buildPlugin verifyPluginProjectConfiguration \
            -PpluginVersion="$version" --no-daemon
          # 이름을 글로브로 잡지 않는다. 앞선 빌드가 남긴 zip 이 하나 더 있으면 mv 가 죽고,
          # 그 실패가 "릴리스에 뭐가 올라갔나"로만 보인다.
          mv "intellij/build/distributions/intellij-$version.zip" "magi-jetbrains-$version.zip"

      - name: release
        working-directory: clients/jetbrains/plugin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "magi for JetBrains ${GITHUB_REF_NAME#jetbrains-v}" \
            --generate-notes \
            magi-jetbrains-*.zip

      # 사람이 zip 을 손으로 다시 깔지 않게 하는 자리.
      #
      # 이 플러그인은 마켓플레이스에 없다. 그래서 릴리스만 올리면 **IDE 가 새 판이 났다는 것을
      # 알 방법이 없다** — 쓰는 사람은 어딘가에서 소식을 듣고 zip 을 받아 다시 깔아야 한다.
      # 커스텀 플러그인 저장소는 그 구멍을 IDE 네이티브로 메운다: 사람이 URL 을 **한 번** 등록하면
      # 그다음부터 갱신을 확인하고 권하는 것은 IDE 다. 우리가 타이머를 돌리지 않는다.
      #
      # since/until 을 손으로 안 적는다. **방금 빌드된 zip 안의 plugin.xml 에서 읽는다** — 여기에
      # 옮겨 적으면 호환 범위가 두 곳에 살고, 한 곳만 고친 날 IDE 는 「호환 안 됨」으로 갱신을
      # 조용히 감춘다. 갈릴 수 있는 것은 갈리지 않게 한 곳에서 가져온다.
      - name: 갱신 채널 — updatePlugins.xml
        working-directory: clients/jetbrains/plugin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#jetbrains-v}"
          zip="magi-jetbrains-$version.zip"
          # 두 겹이다. `plugin.xml` 은 zip 최상위가 아니라 `intellij/lib/intellij-*.jar` **안**에
          # 있다 — 한 겹만 파면 grep 이 빈손이고, 그러면 아래 빈-값 가드가 잡는다. 여기서
          # 손으로 돌려 보고서야 알았다(2026-09-01): 워크플로에서 처음 돌려 보면 태그를 하나
          # 태우고서야 안다.
          tmp=$(mktemp -d)
          jar=$(unzip -Z1 "$zip" | grep -m1 -E 'lib/intellij-[^/]*\.jar$')
          unzip -p "$zip" "$jar" > "$tmp/p.jar"
          xml=$(unzip -p "$tmp/p.jar" META-INF/plugin.xml)
          id=$(printf '%s' "$xml" | tr -d '\n' | sed -n 's|.*<id>\([^<]*\)</id>.*|\1|p')
          since=$(printf '%s' "$xml" | grep -o 'since-build="[^"]*"' | head -1 | cut -d'"' -f2)
          untilb=$(printf '%s' "$xml" | grep -o 'until-build="[^"]*"' | head -1 | cut -d'"' -f2)
          # 빈 값으로 XML 을 쓰면 IDE 는 그 항목을 조용히 무시한다 — 갱신이 안 뜨는데 이유가
          # 어디에도 안 남는다. 여기서 죽는 것이 낫다.
          [ -n "$id" ] && [ -n "$since" ] || { echo "plugin.xml 에서 id/since-build 를 못 읽었다"; exit 1; }
          url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${zip}"
          write() {
            {
              echo '<?xml version="1.0" encoding="UTF-8"?>'
              echo '<plugins>'
              printf '  <plugin id="%s" url="%s" version="%s">\n' "$id" "$url" "$version"
              if [ -n "$untilb" ]; then
                printf '    <idea-version since-build="%s" until-build="%s"/>\n' "$since" "$untilb"
              else
                printf '    <idea-version since-build="%s"/>\n' "$since"
              fi
              echo '  </plugin>'
              echo '</plugins>'
            } > updatePlugins.xml
          }
          cd "$(mktemp -d)"
          git init -q .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # 있는 것 위에 얹는다. 이 브랜치엔 커버리지 배지와 core-latest.txt 가 이미 산다 —
          # 고아 브랜치를 새로 만들어 강제 푸시하면 남의 파일을 지운다(ci.yml 이 겪고 적어 둔 것).
          git fetch -q --depth 1 origin badges && git checkout -q -B badges FETCH_HEAD || git checkout -q -B badges
          write
          git add updatePlugins.xml
          git commit -q -m "jetbrains: $version" || exit 0
          for try in 1 2 3; do
            git push -q origin badges && exit 0
            git fetch -q --depth 1 origin badges || break
            git checkout -q -B badges FETCH_HEAD
            write
            git add updatePlugins.xml
            git commit -q -m "jetbrains: $version" || exit 0
          done
          echo "badges 브랜치에 못 올렸다 — 릴리스는 났지만 갱신 채널이 옛 판을 가리킨다"; exit 1
