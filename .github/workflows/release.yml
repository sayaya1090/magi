name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # goreleaser creates the release, and the step below writes the 'badges' branch

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history + tags so goreleaser can derive the version/changelog
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # WHICH tag this release is for, said rather than derived. goreleaser asks git for the
          # current tag, and git names whichever tag it finds on the commit — this repository puts
          # more than one there (a core release and a console release can land on the same commit),
          # so the core's own run picked up "web-v0.2.0" and stopped at "invalid semantic version".
          # github.ref_name is the tag that triggered THIS run, which is the thing being released.
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}

      # Say which version the CORE is on, at an address that does not move.
      #
      # GitHub's "latest release" is the newest by DATE across every train this repository runs —
      # v* for the core, web-v* for the console, jetbrains-v* for the plugin — so a client asking
      # for /releases/latest/download/<core asset> gets a 404 whenever another train released more
      # recently. Measured 2026-08-31: latest was web-v0.2.0, the core tarball 404'd there, and
      # checksums.txt answered 200 — the console's checksums, which is the dangerous half, because
      # a client that trusted it would check core files against another train's sums.
      #
      # A client can work around it by listing releases and picking the highest v* itself, which
      # costs an unauthenticated API call, a JSON parse, and a second copy of the rule for which
      # train is which. One line at a fixed address costs none of that, and a mirror can serve it
      # as a static file. The tag is written as it is (v-prefixed), because that is what a
      # download URL needs; readers that want the bare number strip it.
      - name: publish the core version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME}"
          tmp=$(mktemp -d)
          cd "$tmp"
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # Onto the branch, never over it: the coverage badge lives here too, and each writer
          # owns one file.
          git fetch -q --depth 1 origin badges && git checkout -q -B badges FETCH_HEAD || git checkout -q -B badges
          printf '%s\n' "$ver" > core-latest.txt
          git add core-latest.txt
          git commit -q -m "core-latest: $ver" || exit 0
          for try in 1 2 3; do
            git push -q origin badges && exit 0
            git fetch -q --depth 1 origin badges || break
            git checkout -q -B badges FETCH_HEAD
            printf '%s\n' "$ver" > core-latest.txt
            git add core-latest.txt
            git commit -q -m "core-latest: $ver" || exit 0
          done
          exit 1
