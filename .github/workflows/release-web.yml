# The console's own release lane. The core binary releases on v* tags through goreleaser, and
# its asset layout is load-bearing (self-update pulls magi_<OS>_<arch> by name) — so the console
# does not ride that train. A web-v* tag releases magi-web alone, versioned on its own clock,
# and a core release never rebuilds the console.
#
# goreleaser is deliberately not used here: tag prefixes in one repository are a goreleaser Pro
# feature, and this lane is six cross-compiles and a checksum file — small enough to say plainly.
#
# Icons: the Font Awesome Pro sprite is NOT baked into release binaries. The Pages demo bakes it
# because a deployed page is "use"; a downloadable binary on a public release is closer to
# redistribution, which the licence does not permit. The fallback glyphs are a working build.
#
# The console itself, on the other hand, IS baked in — and it has to be put there first. web/ui
# compiles with GWT, which needs a JDK and gradle, so the assembled tree is not in the repository
# (cmd/magi-web/console/ holds a README and nothing else). A release built without the assembly
# step below would succeed and ship six binaries whose `/` says "this build has no console" — a
# working BFF and a useless download. That is why the gradle step comes before the builds and not
# after, and why it is not conditional on anything.
name: release-web

on:
  push:
    tags:
      - "web-v*"

permissions:
  contents: write # gh release create uploads the assets
  packages: read # web/ui's dependencies come from GitHub Packages (same owner)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v5
      # 콘솔을 조립해 패키지 안으로 옮긴다. go:embed는 `..`를 넘어가지 못하므로 산출물이
      # 패키지 디렉토리 안에 있어야 하고, 그래서 여기서 굽고 여기로 복사한다. 화면들 자신의
      # 시험(gwt-test·Playwright)은 test-web.yml의 몫이다 — 이 레인은 web-v* 태그가 가리키는
      # 커밋을 싣는 일이고, 그 커밋은 이미 그 레인을 지나왔다.
      - name: Assemble the console into the package
        env:
          GITHUB_USERNAME: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          (cd web/ui && ./gradlew assembleConsole)
          cp -R web/ui/build/console/. cmd/magi-web/console/
          test -f cmd/magi-web/console/console.html   # 비어 있는 채로 여섯 벌을 굽지 않게
      # The same gate Pages uses. These read web/ui directly — the paths the screens ask for, the
      # stylesheet they share — so they fail on a console that drifted from the server serving it.
      - name: Test the console before shipping it
        run: go test ./cmd/magi-web/ -count=1
      - name: Build all targets
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#web-v}"
          COMMIT="$(git rev-parse --short HEAD)"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          LDFLAGS="-s -w \
            -X github.com/sayaya1090/magi/internal/version.Version=${VER} \
            -X github.com/sayaya1090/magi/internal/version.Commit=${COMMIT} \
            -X github.com/sayaya1090/magi/internal/version.Date=${DATE}"
          mkdir -p dist-web
          for os in darwin linux windows; do
            for arch in amd64 arm64; do
              bin=magi-web; [ "$os" = windows ] && bin=magi-web.exe
              stage="dist-web/magi-web_${os}_${arch}"
              mkdir -p "$stage"
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch \
                go build -trimpath -ldflags "$LDFLAGS" -o "$stage/$bin" ./cmd/magi-web
              cp LICENSE NOTICE THIRD_PARTY_LICENSES README.md "$stage/"
              if [ "$os" = windows ]; then
                (cd dist-web && zip -qr "magi-web_${os}_${arch}.zip" "magi-web_${os}_${arch}")
              else
                tar -czf "dist-web/magi-web_${os}_${arch}.tar.gz" -C dist-web "magi-web_${os}_${arch}"
              fi
              rm -r "$stage"
            done
          done
          (cd dist-web && sha256sum ./* > checksums.txt)
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "magi-web ${GITHUB_REF_NAME#web-}" \
            --generate-notes \
            dist-web/*.tar.gz dist-web/*.zip dist-web/checksums.txt
