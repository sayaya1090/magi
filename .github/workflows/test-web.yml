# The new console's own test lane. web/ releases on its own clock (web-v* → release-web.yml)
# and tests on it too: a web-only change runs this and not the Go CI (ci.yml ignores the console UI),
# and a core change does not spend minutes compiling GWT it did not touch.
#
# The Playwright browser specs are real browser tests — chromium is installed with system deps
# before gradle runs them. Dependencies come from GitHub Packages (same owner), so the
# workflow's own token suffices with packages: read.
name: test-web

on:
  push:
    branches: [main]
    paths:
      - "clients/web/**"
      - ".github/workflows/test-web.yml"
  pull_request:
    paths:
      - "clients/web/**"
      - ".github/workflows/test-web.yml"

permissions:
  contents: read
  packages: read

jobs:
  # 아이콘은 한 번만 굽고 산출물로 넘긴다 — 사이트를 짓는 잡마다 npm을 다시 설치하지 않게.
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: ./.github/actions/bake-icons
        with:
          fa-token: ${{ secrets.FONTAWESOME_NPM_AUTH_TOKEN }}
      - name: hand the sprite on
        uses: actions/upload-artifact@v4
        with:
          name: icon-sprite
          path: internal/webassets/sprite_gen.go
          if-no-files-found: ignore

  # 무엇이 바뀌었나 — 화면은 저마다 컴파일되고 저마다의 주기로 배포되므로, 시험도 그 단위로
  # 나눈다. 공용 자리(브리지·컴포넌트·빌드 표)가 바뀌면 그것을 쓰는 것이 전부라 전부를 돈다.
  which:
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.pick.outputs.modules }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: pick
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base=""     # 첫 푸시나 얕은 이력 — 무엇이 바뀌었는지 알 수 없으면 전부 돈다
          fi
          all=$(ls -d clients/web/ui/*-ui 2>/dev/null | xargs -n1 basename | sort)
          if [ -z "$base" ]; then
            changed="$all"
          else
            diff=$(git diff --name-only "$base" HEAD -- clients/web/ui .github/workflows/test-web.yml)
            # 공용 자리가 움직였으면 그것을 쓰는 모든 화면이 대상이다.
            if echo "$diff" | grep -qE '^clients/web/ui/(console-bridge|ui-components)/|^clients/web/ui/(build|settings)\.gradle\.kts|^clients/web/ui/gradle|^\.github/workflows/test-web\.yml'; then
              changed="$all"
            else
              changed=$(echo "$diff" | sed -n 's|^clients/web/ui/\([a-z-]*-ui\)/.*|\1|p' | sort -u)
            fi
          fi
          [ -n "$changed" ] || changed="$all"   # 웹 밖의 변경으로 불려 왔으면 전부 확인한다
          echo "고를 모듈: $(echo $changed | tr '\n' ' ')"
          echo "modules=$(echo "$changed" | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  # 모듈마다 한 러너 — 서로를 기다리지 않는다. 하나가 넘어져도 나머지의 결과는 나온다.
  spec:
    needs: which
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.which.outputs.modules) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v5
      - name: Test ${{ matrix.module }}
        env:
          GITHUB_USERNAME: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: clients/web/ui
        run: ./gradlew :${{ matrix.module }}:test

  # 그리고 콘솔 한 벌이 실제로 서는지 — 여기서 처음 합쳐진다. 바뀌지 않은 모듈은 gradle의
  # 빌드 캐시에서 나오므로 다시 컴파일하지 않는다(캐시는 setup-gradle이 러너 사이에 나른다).
  test:
    needs: spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v5
      - name: Assemble the console
        env:
          GITHUB_USERNAME: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: clients/web/ui
        # 데모의 목도 함께 — 사이트 잡이 그것을 페이지 곁에 싣는다(운영 자산에는 없다).
        run: ./gradlew assembleConsole assembleDemoMock
      # 조립된 콘솔을 사이트 잡에 넘긴다 — 같은 커밋을 두 번 컴파일하지 않게(GWT는 이 레인의
      # 가장 비싼 한 걸음이다). 브라우저 스펙은 앞의 모듈별 잡들이 이미 돌았다.
      - name: hand the assembled console on
        uses: actions/upload-artifact@v4
        with:
          name: console-root
          path: |
            clients/web/ui/build/console
            clients/web/ui/build/demo-mock
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # 그리고 그 콘솔을 실제로 내줄 서버가 그것과 맞는지 — 이 레인이 여기서 닫는 경계다.
      # ci.yml은 콘솔 UI 변경을 무시하는데, clients/web/server의 시험은 이제 web/ui를 직접 읽는다
      # (화면들이 묻는 경로, 함께 쓰는 스타일시트). 그러니 web/만 바뀐 커밋에서 그 시험을
      # 돌리는 자리는 여기뿐이고, 여기서 안 돌리면 아무 데서도 안 돈다.
      - name: Vet and test the server that serves it
        run: |
          set -euo pipefail
          cp -R clients/web/ui/build/console/. clients/web/server/console/
          gofmt -l clients/web/server | tee /dev/stderr | test -z "$(cat)"
          go vet ./clients/web/server
          go build ./clients/web/server
          go test ./clients/web/server/ -count=1

  # 그리고 사람이 하는 일 — 브라우저를 열고, 눌러 보고, 회선을 센다. 이 레인에서 이것만이
  # 답할 수 있는 질문이 있다: 열어 둔 화면이 몇 번 묻는가. 카드마다 「답이 같으면 다시 그리지
  # 않는다」가 있어 스물두 번 묻는 화면도 <b>조용했다</b> — 그리기만 보는 시험은 못 본다.
  #
  # 상대는 진짜 데몬 둘과 진짜 magi-web이다(clients/web/e2e/serve.mjs가 세운다). 정적 데모를
  # 상대로 재면 규칙을 걷어내도 초록이 나온다(실측). 데몬은 턴을 돌리지 않으므로 모델도 열쇠도
  # 필요 없다 — 이 화면들이 묻는 것은 전부 그 프로세스가 제 상태에서 답하는 것이다.
  browser:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: take the assembled console from the earlier step
        uses: actions/download-artifact@v4
        with:
          name: console-root
          path: clients/web/ui/build
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: clients/web/e2e/package-lock.json
      - name: install the browser
        working-directory: clients/web/e2e
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium
      - name: press the console
        working-directory: clients/web/e2e
        run: npx playwright test
      # 넘어졌을 때 무엇을 눌렀는지 남긴다 — 그리고 하네스의 로그도(조용히 죽은 데몬은
      # "컴패니언이 없다"로 보이고, 그것은 시험이 잴 수 있는 실패가 아니다).
      - name: keep what it saw
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-trace
          path: |
            clients/web/e2e/test-results
            clients/web/e2e/playwright-report
          if-no-files-found: ignore

  # main에 실리면 Pages로 콘솔 데모가 나간다 — 사이트 루트에, 한 벌만.
  # deploy-pages는 사이트를 통째로 갈아끼우므로, 이 레인도 전체 사이트를 짓는다 —
  # 조리법은 pages.yml과 같은 composite 하나다.
  site:
    needs: [test, icons, browser]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      pages: write
      id-token: write
      actions: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: take the sprite from the earlier step
        uses: actions/download-artifact@v4
        with:
          name: icon-sprite
          path: internal/webassets
        continue-on-error: true
      - name: take the assembled console from the earlier step
        uses: actions/download-artifact@v4
        with:
          name: console-root
          path: clients/web/ui/build
        continue-on-error: true
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v5
      - name: build the site
        uses: ./.github/actions/pages-site
        env:
          GITHUB_USERNAME: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          fa-token: ${{ secrets.FONTAWESOME_NPM_AUTH_TOKEN }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site
      - name: leave exactly one pages artifact
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          extra=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq '[.artifacts[] | select(.name=="github-pages")]
                  | sort_by(.created_at) | reverse | .[1:] | .[].id')
          if [ -z "$extra" ]; then echo "one artifact, nothing to do"; exit 0; fi
          for id in $extra; do
            echo "deleting duplicate github-pages artifact $id"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
          done
      - id: deployment
        uses: actions/deploy-pages@v5
