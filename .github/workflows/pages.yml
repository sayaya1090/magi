# The console, published as a static demo you can click.
#
# Nobody can look at that screen without running a daemon, a console and a companion — so a change
# to the front end gets reviewed as a diff of a Go string. This publishes the page itself, answered
# by a mock in the browser (GitHub Pages serves files, not processes), so the review is looking at
# it instead.
#
# What a green deploy means, exactly: the Go tests passed — including the ones that run the page's
# real javascript under node against a fake DOM — and the page rendered here is the string this
# binary serves, byte for byte, with one script appended. It does NOT mean any handler works: every
# answer in the demo is a fixture. That is why the tests run first and the deploy is gated on them.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'cmd/magi-web/**'
      - '.github/workflows/pages.yml'
  # A hand-run, for a branch that is not main yet.
  workflow_dispatch:

# One deploy at a time, and a newer push wins: two builds racing to publish leaves whichever
# finished last, which is not necessarily the newer one.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  packages: read # the new console's dependencies come from GitHub Packages
  pages: write
  id-token: write
  # To delete the duplicate artifacts described in the deploy job. Nothing else here writes.
  actions: write

jobs:
  # 같은 커밋이 web/도 건드렸으면 이 레인은 비켜선다.
  #
  # 두 레인이 같은 사이트를 짓는다: 이쪽은 cmd/magi-web의 변화에, test-web은 web/의 변화에.
  # 한 커밋이 둘 다 건드리면 둘이 함께 떠서 같은 8분을 두 번 쓰고, pages 동시성 그룹이 하나를
  # 취소한다 — 남는 것은 옳지만 취소된 줄이 실패처럼 보이고 컴퓨트는 이미 쓰였다. 그래서
  # 여기서 먼저 묻는다: 저쪽이 어차피 배포하는가.
  scope:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.look.outputs.skip }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: look
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "push" ]; then echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          base="$BEFORE"
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then base="HEAD~1"; fi
          if git diff --name-only "$base" HEAD | grep -q '^web/'; then
            echo "이 커밋은 web/도 건드렸다 — 사이트는 test-web이 낸다"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  # 아이콘은 한 번만 굽고 산출물로 넘긴다 — 사이트를 짓는 잡마다 npm을 다시 설치하지 않게.
  icons:
    needs: scope
    if: needs.scope.outputs.skip != 'true' 
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: ./.github/actions/bake-icons
        with:
          fa-token: ${{ secrets.FONTAWESOME_NPM_AUTH_TOKEN }}
      - name: hand the sprite on
        uses: actions/upload-artifact@v4
        with:
          name: icon-sprite
          path: internal/webassets/sprite_gen.go
          if-no-files-found: ignore

  build:
    needs: icons
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: take the sprite from the earlier step
        uses: actions/download-artifact@v4
        with:
          name: icon-sprite
          path: internal/webassets
        continue-on-error: true
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # The functional check. These run the page's own javascript under node against a fake DOM —
      # the states, the filters, the tabs, the forms — so a demo that deploys is one whose behaviour
      # was verified rather than eyeballed.
      - name: test the console
        run: go test ./cmd/magi-web/ -count=1

      # The site is one artifact and deploy-pages replaces it whole, so every lane that
      # publishes must build everything — the shared recipe (icons, old demo, bench report,
      # and the NEW console's demo under next/) lives in one composite action, used here and
      # by test-web.yml. The new console builds with gradle, so java comes first.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v5
      - name: build the site
        uses: ./.github/actions/pages-site
        env:
          GITHUB_USERNAME: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          fa-token: ${{ secrets.FONTAWESOME_NPM_AUTH_TOKEN }}

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  # Automatic publishing is main's. A DISPATCH publishes from wherever it was asked for, because
  # somebody typing "run this on that branch" is asking for exactly that preview — and whether the
  # branch may publish is already decided one layer up, by the github-pages environment's deployment
  # branch list (Settings → Environments → github-pages). Two places deciding the same thing is how
  # a permission that was granted stays refused.
  #
  # The first branch run failed here with "not allowed to deploy to github-pages due to environment
  # protection rules" — a setting doing its job, reported as a broken build. That is the shape to
  # keep: the environment refuses, loudly, and this file does not pre-refuse on its behalf.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # deploy-pages refuses when the run holds more than one artifact called github-pages, and a
      # run can end up holding several two ways: re-running a failed deploy leaves the previous
      # attempt's upload in place, and the upload step itself has been observed producing three at
      # once — run 31236274403 had three, all created inside the same second, from a single build.
      #
      # Whichever it was, the deploy only ever needs the newest, and it is worth more to publish
      # than to preserve evidence of a runner hiccup. The older ones go.
      #
      # It cannot STOP the deploy, though, and once did: a runner reached api.github.com through
      # something presenting a certificate for no names at all, this step exited 1, and the publish
      # was skipped over a tidy-up (run 31540871230 — the build had already succeeded and uploaded).
      # If the duplicates it exists to remove are really there, deploy-pages refuses on its own and
      # says so in its own words, which is a better failure than this one.
      - name: leave exactly one pages artifact
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          extra=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq '[.artifacts[] | select(.name=="github-pages")]
                  | sort_by(.created_at) | reverse | .[1:] | .[].id')
          if [ -z "$extra" ]; then echo "one artifact, nothing to do"; exit 0; fi
          for id in $extra; do
            echo "deleting duplicate github-pages artifact $id"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
          done

      - id: deployment
        uses: actions/deploy-pages@v5
