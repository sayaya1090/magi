# Does the icon token in this repository's secrets actually open the door?
#
# The console's icons are Font Awesome Pro. The files are not in this repository and must not be —
# a licence that permits using them in a site you deploy does not permit republishing them as files
# — so the Pages build fetches them at build time from Font Awesome's own registry, with a token
# held in secrets. A token is only readable inside a workflow run, which makes this the only place
# it can be checked.
#
# Dispatch only. It writes nothing, deploys nothing, and prints no part of the token: it asks the
# registry for a version string and reports which of the two package shapes answered.
name: Icons token check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: ask the registry, without saying the password out loud
        env:
          FA_TOKEN: ${{ secrets.FONTAWESOME_NPM_AUTH_TOKEN }}
        run: |
          set -uo pipefail
          if [ -z "${FA_TOKEN}" ]; then
            echo "::error::FONTAWESOME_NPM_AUTH_TOKEN is not set in this repository's secrets"
            exit 1
          fi
          echo "the secret is present (${#FA_TOKEN} characters)"

          # Scoped to the two registries Font Awesome serves, in a config this job throws away.
          cat > .npmrc <<'EOF'
          @fortawesome:registry=https://npm.fontawesome.com/
          @awesome.me:registry=https://npm.fontawesome.com/
          EOF
          printf '//npm.fontawesome.com/:_authToken=%s\n' "${FA_TOKEN}" >> .npmrc

          # Four shapes, because only the registry can say what this token opens, and the answer
          # decides how the Pages build gets its icons:
          #   fontawesome-pro        — ships svgs/<style>/<name>.svg, the same layout as the kit's
          #                            own download, so ONE generator reads both. What we want.
          #   sharp-*-svg-icons      — path data as javascript modules; usable, but a second reader.
          #   kit-<id>               — the hand-picked 113, and needs the kit's package enabled.
          ok=0
          for pkg in "@fortawesome/fontawesome-pro" "@fortawesome/sharp-light-svg-icons" \
                     "@fortawesome/sharp-solid-svg-icons" "@awesome.me/kit-fd54b971dc"; do
            if v=$(npm view "$pkg" version 2>/tmp/err); then
              echo "✓ $pkg → $v"
              ok=1
            else
              echo "✗ $pkg — $(tail -3 /tmp/err | tr '\n' ' ')"
            fi
          done
          rm -f .npmrc
          if [ "$ok" -eq 0 ]; then
            echo "::error::the token opened neither package; it is the wrong token or has been revoked"
            exit 1
          fi
