name = "engram"
version = "1.0.0"
description = "자기개선 관찰자 — 결과가 확정된 턴에서 교훈/검증된 스킬을 추출해 SESSION_SUMMARY.md/.claude/skills에 누적하고, 세션 컨텍스트로 회상한다"
entry = "init.lua"
exec_timeout = "10m"
capabilities = ["context-provider", "analyze", "experience", "notify", "command", "tool"]
permissions = ["fs:read", "fs:write", "net:127.0.0.1", "net:localhost", "config:read:embed_model", "exec:docker", "exec:podman"]
