<!doctype html>
<meta charset="utf-8">
<!-- interactive-widget=resizes-content: the on-screen keyboard shrinks the LAYOUT, not just the
     visual viewport. Without it a phone's keyboard covers the bottom 300px and the page does not
     know — measured on a full-screen dialog, the whole action row (584–664 of a 664px window) was
     under the keyboard with nothing able to scroll it into view, because the dialog is 100dvh of a
     viewport the keyboard never changed. With it, dvh and every fixed foot on this page — the
     composer, the dialogs' actions, the navigation bar — sit above the keyboard. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#14110d">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg">
<link rel="apple-touch-icon" href="/icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="magi">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>magi</title>
<!-- Before the stylesheet, and deliberately not in the module at the end of the page: a theme
     applied after first paint is a flash of the other one, and on a dark-preferring machine that
     picked light it is a white flash in a dark room. Four lines, so it stays here rather than
     becoming a file the page has to wait for. The module reads the same key. -->
<script>
  try {
    var want = localStorage.getItem('theme');
    if (want === 'light' || want === 'dark') document.documentElement.setAttribute('color-theme', want);
  } catch (e) { /* storage can be denied; the machine's own preference still answers */ }
</script>
<style>
<!--magi:css-->
</style>

<!-- The icon definitions, or nothing. Immediately before the first markup that uses one, so a
     <use> anywhere below resolves. Empty in a build with no Font Awesome licence to hand — see
     icons.go — and the page then draws the shapes it has always drawn. -->
<!--ICON-SPRITE-->

<!-- Working, said where it is visible from anywhere.
     The transcript already marks the row a turn is waiting on, and for a TOOL call that mark is a
     moving bar that names which call — which is the better answer and stays. This is for the part
     that mark cannot reach: the wait before the model has said anything, whose row is the person's
     own prompt and carried a static word, and any wait at all once the transcript has scrolled the
     last row out of the window. With a slow model that is minutes in which the screen looks the
     same whether the request is being worked on or never arrived.
     aria-hidden because the row says it in words already, and a bar that announced the same state
     a second time would make the transcript harder to read for exactly the people who most need
     it read out. -->
<div id="turnwrap" hidden>
  <md-linear-progress id="turnbar" indeterminate aria-hidden="true"></md-linear-progress>
  <!-- And how long it has been going. A bar says something is happening; only the number answers
       the question somebody has at four minutes, which is whether this is still happening or has
       quietly stopped. The terminal has shown it beside its spinner since it had one.
       aria-hidden with the bar: a figure that re-announced itself every second would make the
       transcript unusable for the readers who most depend on hearing it. -->
  <span id="turnfor" aria-hidden="true"></span>
</div>
<header id="masthead">
  <!-- The hamburger is on both sizes and means two different things, which is the point: on a wide
       screen it widens the rail into a drawer, on a narrow one it slides that drawer in over the
       page. Either way it is the way to the settings, which is why a phone has it too even though
       a phone navigates with the tabs. -->
  <!-- The page's one h1. Assistive tech navigates by heading and this page had none — every
       section head was a styled div, so there was nothing to jump between. Levels follow the
       CONTENT hierarchy, not the type size: the product, then the groups inside each destination.
       h2 for those groups and not h3 — measured in a browser, the fleet and the board have no
       section head above them, so h3 there skipped a level from this h1, which the guide forbids
       outright. Two levels is all this page has. -->
  <h1 class="mark">MAGI</h1>
  <!-- Which magi this is, beside its name. A supervisor has three of these open in three tabs and
       the pages are identical; before this the only way to tell them apart was to recognise the
       companions in the list, which fails at exactly the moment it matters — when two machines are
       running the same work. user@host, because that pair is what a policy, a session store and a
       set of companions belong to; the config directory behind it is in the preferences, where the
       question is "which directory" rather than "which magi".
       Empty until /console answers, and it stays empty on a console that cannot say — a masthead
       reading "unknown" is worse than one that does not claim. -->
  <span id="whereami" class="whereami"></span>
  <!-- Where you are, always, in both views: magi / fleet, or magi / fleet / <agent>. The middle
       crumb is the way back, which is the same element that says where back goes. -->
  <nav id="crumbs"><a href="/" id="back">companions</a><span id="crumbSep" hidden>/</span><a id="crumbHere"></a><span id="crumbSep2" hidden>/</span><a id="crumbDeep"></a><span id="crumbSep3" hidden>/</span><span id="crumbLeaf"></span></nav>
  <span class="sid" id="sid"></span>
  <!-- The one place that speaks. Errors, the connection dropping, and a search narrowing all
       changed silently before this: a screen reader was never told. role=status with a polite
       live region announces without stealing focus, which is what the guide asks for a status
       message and what it names for search results appearing. -->
  <span id="state" role="status" aria-live="polite"></span>
  <!-- Where a passing message goes, and it is not the line above.
       That line is the fleet's count, rebuilt every three seconds by the poll — so a message
       written into it lived for whatever was left of the interval, sometimes a tenth of a second,
       and while it showed there was no count and no way to jump to whoever was waiting. Two
       writers on one readout, again. This one has a single writer and no timer: a message stays
       until something replaces it or the screen changes, because a notice that removes itself is
       one somebody can miss, which is the guide's whole objection to snackbars on the web. -->
  <span id="note" role="status" aria-live="polite"></span>
  <!-- The page's one announcer. A live region has to be in the document BEFORE its text changes —
       one created per render is inserted already-full and says nothing. Everything that changes
       without moving focus speaks through here. -->
  <span id="say" class="sr-only" role="status" aria-live="polite"></span>
  <!-- One tooltip for the page. Native title= only appears on hover, never on keyboard focus, and
       carries no role — so every icon-only control on this page was unlabelled for anyone tabbing
       through it. This surface is aria-hidden: the button beside it already carries the same words
       as its aria-label, and announcing both would say everything twice. -->
  <span id="tip" role="tooltip" aria-hidden="true" hidden></span>
  <!-- Narrow only, and top right where a thumb reaches. It shows what pressing it GIVES you — a sun
       while the page is dark — because a control showing its current state leaves you working out
       what it does. Two shapes with one hidden, rather than a morphing path: an icon that changes
       shape is an icon that has to be got right twice. -->
  <!-- Sliders, not a cog. A cog beside the theme toggle is a circle with spokes next to a circle
       with rays: at 21px they are the same picture, and the two controls sat side by side. -->
  <!-- The two pane handles, in the masthead rather than in the columns they open.
       Inside the content they were two controls floating at the top of two columns, and the eye
       read them as part of the panes rather than as the window's own chrome — with nothing to line
       up against, on a page whose columns otherwise square up. Here they sit on one line with the
       preferences, which is what they are: how this window is arranged. Drawn only on a
       companion's page; there are no panes anywhere else. -->
  <md-icon-button id="filesToggle" toggle aria-expanded="false">
    <!-- The same drawing as the state pane's handle, mirrored: a screen with a divider, and
     the divider slides in from the leading edge as this pane does. One picture for one
     idea, on both sides of the page. -->
    <svg class="panelic lead" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
  <path d="M4 5h16v14H4z" stroke="currentColor" stroke-width="1.6" fill="none"
    stroke-linejoin="round"/>
  <path d="M4 9.5h16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
  <path class="split" d="M9 9.5v9.5" stroke="currentColor" stroke-width="1.6"
    stroke-linecap="round"/>
    </svg>
  </md-icon-button>
  <md-icon-button id="sideToggle" toggle aria-expanded="false">
    <svg class="panelic" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
  <path d="M4 5h16v14H4z" stroke="currentColor" stroke-width="1.6" fill="none"
    stroke-linejoin="round"/>
  <path d="M4 9.5h16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
  <path class="split" d="M15 9.5v9.5" stroke="currentColor" stroke-width="1.6"
    stroke-linecap="round"/>
    </svg>
  </md-icon-button>
  <!-- The palette, for the people and the machines that have no ⌘+K: a phone has no modifier key,
       and nobody discovers a keyboard shortcut that is written down nowhere. Same dialog, same
       entries — this is the door, not a second implementation. -->
  <md-icon-button id="palOpen">
    <svg data-i="#i-sl-magnifying-glass" viewBox="0 0 24 24" width="21" height="21" aria-hidden="true">
      <circle cx="11" cy="11" r="6" stroke="currentColor" stroke-width="1.8" fill="none"/>
      <path d="M15.5 15.5 20 20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    </svg>
  </md-icon-button>
  <md-icon-button id="prefs">
    <svg data-i="#i-sl-sliders" viewBox="0 0 24 24" width="21" height="21" aria-hidden="true">
      <path d="M4 7h9M17 7h3M4 12h3M11 12h9M4 17h9M17 17h3"
            stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/>
      <circle cx="15" cy="7" r="2" stroke="currentColor" stroke-width="1.8" fill="none"/>
      <circle cx="9" cy="12" r="2" stroke="currentColor" stroke-width="1.8" fill="none"/>
      <circle cx="15" cy="17" r="2" stroke="currentColor" stroke-width="1.8" fill="none"/>
    </svg>
  </md-icon-button>
</header>

<!-- The rail is the wide screen's navigation and the narrow screen's settings drawer — one element
     in two modes rather than two that have to agree. Its items are md-list-item with an href, so
     they are real links with the component's ripple and focus ring: a rail you cannot middle-click
     is a navigation that forgot it was made of addresses. -->

<div id="scrim"></div>
<nav id="rail">
  <!-- The button that widens the rail lives IN the rail, beside what it moves. In the masthead's
       far corner it did not look like it belonged to the column across the page. -->
  <!-- One icon with three lines, not two icons swapped. The guide asks that an expanded rail's menu
       icon say it can be collapsed, and aria-expanded says that only to a screen reader — the
       sighted user pressing it twice got the same three lines both times.
       Drawn here rather than taken from the sprite, and this is the one place where that is the
       better drawing: a symbol can be exchanged for another symbol, and what this control wants is
       for the SAME three strokes to travel — the outer two rotating into a cross while the middle
       one goes. That is three elements moving, which no single glyph can be. -->
  <md-icon-button id="railMenu" aria-expanded="false">
    <svg class="burger" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
      <!-- Five strokes, because the top and bottom bars are each two halves. Closed, the halves sit
           end to end and read as one line; opened, each half swings about the point where it met
           its twin and the four of them become the arms of the cross. The middle bar has no twin
           to become, so it draws itself in to its own centre and is gone. -->
      <line class="bt bl" x1="3"  y1="6"  x2="12" y2="6"/>
      <line class="bt br" x1="12" y1="6"  x2="21" y2="6"/>
      <line class="bm"    x1="3"  y1="12" x2="21" y2="12"/>
      <line class="bb bl" x1="3"  y1="18" x2="12" y2="18"/>
      <line class="bb br" x1="12" y1="18" x2="21" y2="18"/>
    </svg>
  </md-icon-button>
  <!-- The icons are drawn here rather than pulled from Material Symbols: that is a whole font to
       embed for four glyphs, and this page already refuses a font CDN for the typeface it reads
       with. Stroked in currentColor, so the selected state colours the shape with its label. -->
  <!-- Two anchors, not a list.
       A navigation rail is not a list and Material Web ships no rail, so these were md-list-item
       wearing the job — and the job kept showing. That component writes role="listitem" onto the
       anchor it renders, which cost the link semantics and name-from-content both, and had to be
       undone from JS by reaching into its shadow root. It lays its slots out in a row, so the icon
       could never sit ABOVE the word, which is the shape the collapsed rail is drawn in and the
       reason this page hid its labels. And its ripple and focus ring each needed a ::part rule to
       be told what shape the item was.
       An anchor is a link by being one. The page already draws its own tooltips, focus rings and
       state layers for the controls it builds; this is one more, and it is smaller than the
       workarounds it replaces. -->
  <div id="railNav">
    <a id="railFleet" class="raili">
      <!-- The badge rides the icon, which is what a badge is for and the only place it can be when
           the rail is collapsed to icons. -->
      <span class="icwrap">
        <svg data-i="#i-sl-users" class="ic" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path
          d="M4 19v-1.6a3.4 3.4 0 0 1 3.4-3.4h2.2a3.4 3.4 0 0 1 3.4 3.4V19M8.5 6.2a2.6 2.6 0 1 1 0 5.2 2.6 2.6 0 0 1 0-5.2M15.5 19v-1.6a3.4 3.4 0 0 0-1.2-2.6M15 6.4a2.6 2.6 0 0 1 0 5"
          fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <md-badge id="railBadge" hidden></md-badge>
      </span>
      <!-- The word and the sentence under it, in a box of their own: the item is a row of icon
           then words, and two loose spans would sit side by side in it. Collapsed, the box holds
           only the word — the sentence is not drawn — and the item stacks as it always did. -->
      <span class="words"><span class="lbl"></span><span class="lblshort"></span><span class="sub"></span></span>
    </a>
    <a id="railSkills" class="raili">
      <span class="icwrap">
        <!-- A store, not a lightbulb. What is behind this destination is the pool every companion
             here reads from and writes to — the lessons they have learned and the tool servers
             they can reach — and a lightbulb says "idea", which is one of the two halves at best.
             Stacked discs is the drawing everybody already reads as shared data. -->
        <svg data-i="#i-sl-database" class="ic" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path
          d="M12 3c4.2 0 7 1.1 7 2.3S16.2 7.6 12 7.6 5 6.5 5 5.3 7.8 3 12 3M5 5.3v13.4C5 19.9 7.8 21 12 21s7-1.1 7-2.3V5.3M5 12c0 1.2 2.8 2.3 7 2.3s7-1.1 7-2.3"
          fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <!-- The word and the sentence under it, in a box of their own: the item is a row of icon
           then words, and two loose spans would sit side by side in it. Collapsed, the box holds
           only the word — the sentence is not drawn — and the item stacks as it always did. -->
      <span class="words"><span class="lbl"></span><span class="lblshort"></span><span class="sub"></span></span>
    </a>
    <!-- Companions talking to each other. A destination and not a control on the fleet: a meeting
         outlives the screen it was convened from, and somebody coming back to one an hour later
         should not have to remember which list had the button. The convening form lives here too,
         because picking who is in the room is the first thing you do on the way in.
         data-may for the same reason the screen carries it: a meeting is model turns on several
         companions at once, and a way in that only leads to a refusal is not a way anywhere. -->
    <a id="railMeet" class="raili" data-may="prompt">
      <span class="icwrap">
        <!-- Two speech bubbles: the one drawing everybody already reads as a discussion, and the
             only one on this rail that is about companions talking rather than about work. -->
        <svg data-i="#i-sl-comments" class="ic" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path
          d="M9.5 4h6.8A2.7 2.7 0 0 1 19 6.7v4.1a2.7 2.7 0 0 1-2.7 2.7H15l-3 2.6v-2.6H9.5a2.7 2.7 0 0 1-2.7-2.7V6.7A2.7 2.7 0 0 1 9.5 4M5 9.4v5.9a2.7 2.7 0 0 0 2.7 2.7H9v2.4l2.8-2.4h2"
          fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <!-- The word and the sentence under it, in a box of their own: the item is a row of icon
           then words, and two loose spans would sit side by side in it. Collapsed, the box holds
           only the word — the sentence is not drawn — and the item stacks as it always did. -->
      <span class="words"><span class="lbl"></span><span class="lblshort"></span><span class="sub"></span></span>
    </a>
  </div>

  <!-- Who may use this console, at the foot of the rail and away from the other two.
       It is a destination like they are — its own screen with its own address — but it is not one
       anybody lives on: it is opened when somebody joins or leaves. The guide gives the foot of a
       rail to exactly that, the items about the console rather than about the work, and the gap
       above it is what says the two groups are different kinds of thing.
       data-may hides it from anybody who could not act on it anyway; the server refuses
       regardless, and applyMay only ever takes away. -->
  <div id="railFoot">
    <a id="railAccess" class="raili" data-may="admin">
      <span class="icwrap">
        <svg data-i="#i-sl-people-group" class="ic" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path
          d="M12 13.4a2.9 2.9 0 1 0 0-5.8 2.9 2.9 0 0 0 0 5.8M7.5 20v-1.1a3 3 0 0 1 3-3h3a3 3 0 0 1 3 3V20M5.2 10.8a2 2 0 1 0 0-4 2 2 0 0 0 0 4M2.5 17.2v-.8a2.4 2.4 0 0 1 2.4-2.4M18.8 10.8a2 2 0 1 0 0-4 2 2 0 0 0 0 4M21.5 17.2v-.8a2.4 2.4 0 0 0-2.4-2.4"
          fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <!-- The word and the sentence under it, in a box of their own: the item is a row of icon
           then words, and two loose spans would sit side by side in it. Collapsed, the box holds
           only the word — the sentence is not drawn — and the item stacks as it always did. -->
      <span class="words"><span class="lbl"></span><span class="lblshort"></span><span class="sub"></span></span>
    </a>
  </div>

</nav>

<main>
  <!-- The screen's name, for somebody who navigates by heading.
       Assistive tech jumps a page by its headings, and two of the four screens had exactly one —
       the product's name in the masthead, identical on every screen. A companion's page in
       particular put its subject only inside a crumb, so "which companion is this" had no answer
       in the heading tree. Written here, hidden from the eye: the screens that already show a
       heading keep theirs and this one stays empty. -->
  <h2 class="sr-only" id="screenHead"></h2>
  <!-- The strip of destinations that used to live here is gone.
       It was `display:none` at every width — two rules, one on each side of the breakpoint, cover
       the whole axis — while the javascript kept it in step: setting its active tab on every
       destination change and writing its badge on every fleet poll. A second navigation carrying
       two of the rail's four destinations, drawn nowhere, told nothing to a screen reader, and
       reachable by no key. The rail and the phone's bar are the navigation. -->
    <md-chip-set id="summary"></md-chip-set>
  <!-- Two things share this destination: what companions have learned, and the servers they can
       reach. On a phone that is two purposes on one screen, so the strip switches between them —
       and above the breakpoint it is not drawn, because both are in one column there. -->
  <div id="sharedTabs" class="onetabs" hidden></div>
  <div id="skills" hidden></div>
  <!-- The wiki half of the knowledge screen: canonical pages, their editors, and the stale
       tombstones the agent-facing index deliberately hides — a governance read, like #skills. -->
  <div id="wiki" hidden></div>
  <div id="board" hidden></div>
  <!-- How the fleet is laid out and what is crossing between the parts of it. Not a destination of
       its own: it is the companions screen drawn the other way round — the same rows, grouped by
       the instance they belong to instead of by team — and a third seat in a navigation that has to
       fit on a phone would cost more than it buys. It keeps its own address, so it can be linked
       and reloaded. -->
  <div id="map" hidden></div>
  <!-- Companions talking to each other. Its own address and not a seat in the navigation, for the
       same reason the map has neither: a screen somebody opens when they have a question worth
       three companions' time is not one they live on, and the rail has to fit on a phone. It is
       reached from the fleet, which is where the participants are. -->
  <div id="meet" hidden data-may="prompt"></div>
  <div id="mcp" hidden></div>
  <!-- Who may use this console. Its own screen and not a tab: it is opened when somebody joins or
       leaves, which is not daily, and the navigation has to fit on a phone. data-may hides it from
       anybody who could not act on it anyway — the server refuses regardless. -->
  <div id="access" hidden data-may="admin"></div>
  <!-- The settings DESTINATION. This lived in a dialog ("Preferences, in one place instead of
       four") and outgrew it: seven groups, its own scrollbar, a form whose required field once
       held the whole dialog hostage, and a global-vs-companion axis still to come. A dialog is
       for a short task worth interrupting for; this is a place. Same classes, same ids, same
       handlers — what changed is the container, and that the form is a DIV now: nothing here
       submits, and the one thing form-ness ever did to this content was swallow button presses.
       Every control saves the moment it changes, which is why the screen has no save button. -->
  <div id="settings" hidden>
    <div id="prefsK"></div>
    <!-- WHICH config this screen edits, said out loud. The rule was always there and never
         spoken: opened from the fleet it writes the machine's config, opened from a companion it
         writes that companion's project config. Same controls, different file, decided by where
         somebody happened to be standing — which is exactly the kind of hidden axis that made a
         dialog the wrong container. The path is named because "which file" is the question a
         person asks next, and because it is the one they can go and read. -->
    <div id="settingsScope" class="prefsay">
      <div class="k" id="settingsScopeK"></div>
      <div class="say" id="settingsScopeFile"></div>
    </div>
    <div id="prefsForm">
    <div class="prefgroup" id="grpAppearance"></div>
    <div class="prefrow">
      <div class="prefsay"><div class="k" id="themeK"></div><div class="say" id="themeWhy"></div></div>
      <!-- One sky, three bodies: the sun, the moon, and the half-lit circle that means "whatever
           the machine says". Pressing it does not swap an icon — the next body climbs out of the
           horizon while the last one sinks the same way it came, so the button says which
           direction it is going as well as where it ends up.

           Three, and not two plus a select beside it. The value this console starts on is
           "follow the machine", and a two-state toggle could not return to it: choosing light or
           dark once meant never getting back without clearing storage. Drawn here rather than taken from the
           sprite for the reason the hamburger is — a symbol can be exchanged for another symbol,
           and what this wants is two shapes that MOVE past each other. -->
      <!-- type="button", or it submits the form it is in — and this form is method="dialog", so a
           press would close the preferences on the way to changing the theme. The same default
           closed the report-format dialog when somebody dropped a section. -->
      <md-icon-button id="themeToggle" type="button">
        <svg class="sky" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <g class="sun">
            <circle cx="12" cy="12" r="4.2" stroke="currentColor" stroke-width="1.8" fill="none"/>
            <path d="M12 2.4v2.4M12 19.2v2.4M21.6 12h-2.4M4.8 12H2.4M18.6 5.4l-1.7 1.7M7.1 16.9l-1.7 1.7M18.6 18.6l-1.7-1.7M7.1 7.1L5.4 5.4"
                  stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/>
          </g>
          <g class="moon">
            <path d="M20 14.2A8.4 8.4 0 0 1 9.8 4a8.4 8.4 0 1 0 10.2 10.2z"
                  stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" fill="none"/>
          </g>
          <!-- Following the machine: half lit, which is the mark this means everywhere and the one
               body of the three that is not a claim about the time of day. Sized against the MOON
               rather than the sun's core — the sun is small in the middle of eight rays and reads
               as wide as all of them, so a circle at the core's radius looked like a dot beside
               the other two. -->
          <g class="auto">
            <circle cx="12" cy="12" r="7.4" stroke="currentColor" stroke-width="1.8" fill="none"/>
            <path d="M12 4.6a7.4 7.4 0 0 0 0 14.8z" fill="currentColor"/>
          </g>
        </svg>
      </md-icon-button>
    </div>
    <div class="prefrow">
      <!-- No .say line for language: the control explains itself, and an empty say div was the
           one prefsay whose text nothing ever filled (the same empty-span class d8bd3f19 fixed). -->
      <div class="prefsay"><div class="k" id="langK"></div></div>
      <md-outlined-select id="lang"></md-outlined-select>
    </div>
    <!-- A setting that is on or off, so a switch: the guide keeps switches for exactly this and
         says the effect must be immediate, which subscribing is. Paired with an inline label,
         which it also asks for — and no icon in the handle, because the ones that would fit here
         (a bell, a moon) are the ambiguous kind it warns against. -->
    <div class="prefgroup" id="grpNotify"></div>
    <div class="prefrow" id="notify">
      <!-- Label, the supporting line UNDER it, and the control at the trailing end — the shape
           the guide gives a list item, and the reason it is that shape: supporting text below the
           label is what keeps the labels themselves on one scannable column. Beside it, in the
           middle of the row, the three settings stopped aligning as soon as one sentence wrapped. -->
      <div class="prefsay"><div class="k" id="notifyK"></div><div class="say" id="notifyWhy"></div></div>
      <md-switch id="notifySwitch" touch-target="wrapper"></md-switch>
    </div>
    <!-- The model-assistance toggles, all `prompt` because each spends the backend. They are the
         reader's own choice (localStorage), which is why they are switches here and not config. -->
    <div class="prefgroup" id="grpAssist" data-may="prompt"></div>
    <!-- Whether the model reads over your shoulder while you edit a file. A preference and not a
         control on the editor: it is true of every file you open rather than of the one in front of
         you, and as a row inside the editor it spent a line of a narrow pane saying so on every
         file. data-may because asking spends the backend, which is what `prompt` is about. -->
    <div class="prefrow" data-may="prompt">
      <div class="prefsay"><div class="k" id="lookK"></div><div class="say" id="lookWhy"></div></div>
      <md-switch id="lookSwitch" touch-target="wrapper"></md-switch>
    </div>
    <!-- Inline code completion in the editor, and next-instruction suggestion in the composer. Both
         spend a fast profile on a pause in typing, so data-may="prompt" like look-over; both do
         nothing until a fast profile is routed, which the block below assigns. -->
    <div class="prefrow" data-may="prompt">
      <div class="prefsay"><div class="k" id="acK"></div><div class="say" id="acWhy"></div></div>
      <md-switch id="acSwitch" touch-target="wrapper"></md-switch>
    </div>
    <div class="prefrow" data-may="prompt">
      <div class="prefsay"><div class="k" id="sugK"></div><div class="say" id="sugWhy"></div></div>
      <md-switch id="sugSwitch" touch-target="wrapper"></md-switch>
    </div>
    <!-- The completion settings the DAEMON reads: which fast profile does each kind, whether the
         edited file rides into context, the draft house rules. Configuration of a running companion,
         so data-may="configure" and written to its config.toml (the block loads and saves against
         whichever companion the console is looking at, or the global config). -->
    <div class="prefgroup" id="grpComplete" data-may="configure"></div>
    <div class="prefsay" data-may="configure" id="acsBlock">
      <div class="say" id="acsWhy"></div>
    </div>
    <div class="prefrow" data-may="configure">
      <div class="prefsay"><div class="k" id="ambientK"></div><div class="say" id="ambientWhy"></div></div>
      <md-switch id="ambientSwitch" touch-target="wrapper"></md-switch>
    </div>
    <div class="prefrow" data-may="configure">
      <div class="prefsay"><div class="k" id="crossK"></div><div class="say" id="crossWhy"></div></div>
      <md-switch id="crossSwitch" touch-target="wrapper"></md-switch>
    </div>
    <div class="prefrow" data-may="configure">
      <div class="prefsay"><div class="k" id="codeProfK"></div><div class="say" id="codeProfWhy"></div></div>
      <md-outlined-select id="codeProfSel"></md-outlined-select>
    </div>
    <div class="prefrow" data-may="configure">
      <div class="prefsay"><div class="k" id="compProfK"></div><div class="say" id="compProfWhy"></div></div>
      <md-outlined-select id="compProfSel"></md-outlined-select>
    </div>
    <div class="prefsay" data-may="configure">
      <div class="k" id="commitTplK"></div>
      <md-outlined-text-field id="commitTpl" type="textarea" rows="3"></md-outlined-text-field>
    </div>
    <div class="prefsay" data-may="configure">
      <div class="k" id="prTplK"></div>
      <md-outlined-text-field id="prTpl" type="textarea" rows="3"></md-outlined-text-field>
    </div>
    <!-- The named LLM backends the profile pickers above choose from — defined and edited right here,
         so a fast profile can be set up without opening config.toml or the TUI's /route editor. The
         key is write-only: it is never sent back, only whether one is set. -->
    <div class="prefgroup" id="grpProfiles" data-may="configure"></div>
    <div class="prefsay" data-may="configure"><div class="say" id="profWhy"></div></div>
    <div class="prefsay" data-may="configure"><div id="profList" class="proflist"></div></div>
  <!-- The provider picker: the CLI backends serving RIGHT NOW, each with its own model list. Two
       dropdowns instead of an address — the shims record where they answer (plugin-data), the
       console reads it, and a pick fills the free-text fields below, which stay the escape hatch
       for any other OpenAI endpoint. Hidden entirely while nothing is serving: a picker with no
       providers teaches people not to open it. -->
  <div class="profadd" id="provRow" data-may="configure" hidden>
    <md-outlined-select id="provSel"></md-outlined-select>
    <md-outlined-select id="provModelSel"></md-outlined-select>
  </div>
  <div class="prefsay" data-may="configure" id="provWhy" hidden><div class="say" id="provWhyText"></div></div>
    <div class="profadd" data-may="configure">
      <!-- required: the bundle puts the guide's asterisk on the label, and the save handler
           routes a missing/refused name to THIS field's error slot rather than the status line -->
      <md-outlined-text-field id="profName" required></md-outlined-text-field>
      <md-outlined-text-field id="profBase"></md-outlined-text-field>
      <md-outlined-text-field id="profModel"></md-outlined-text-field>
      <md-outlined-text-field id="profKey"></md-outlined-text-field>
      <md-text-button id="profSave" type="button"></md-text-button>
    </div>
    <!-- The phone's way to the access screen, and only the phone's. The rail carries it at every
         other width; below 37.4375em the rail is not drawn at all, and without this row the screen
         would be reachable only by typing ?v=access — a screen nobody finds, which is how "is it
         built?" gets asked about something that is.
         Hidden where the rail is drawn rather than kept as a second permanent door: two ways to
         one screen, both on screen at once, is a reader wondering which of them is the real one.
         It is the same address either way. data-may hides it from anybody who would be refused the
         screen behind it. -->
    <div class="prefgroup" id="grpConsole"></div>
    <div class="prefrow narrowonly" data-may="admin">
      <div class="prefsay"><div class="k" id="accessK"></div><div class="say" id="accessWhy"></div></div>
      <md-text-button id="accessGo" type="button"></md-text-button>
    </div>
    <!-- One block, not two rows. Split, the heading sat exactly as far from its own contents as
         from the setting above it, so it read as floating between the two rather than belonging to
         what is under it. -->
    <div class="prefsay">
      <div class="k" id="consoleK"></div>
      <div id="console"></div>
    </div>
    </div>
  </div>
  <div id="fleet"></div>
  <!-- Two reasons to be on a companion's page, and they want different things. Checking on it wants
       the facts: state, workspace, model, context, plan. Reading what it is doing and steering it
       wants the transcript and the box under it.
       
       Stacked, the transcript was 1335px down a 1267px screen — off it — behind five cards of which
       three are history. So the conversation is the page and the facts stand beside it, and on a
       narrow screen the conversation comes first with the rest underneath. -->
  <!-- One companion, four screens, where the window can only hold one of them. Status used to be
       a single tab holding everything that is not the conversation: measured on a phone, 1289px of
       facts and 1161px of plan and handoffs and cron stacked behind it, 3.7 screens of scrolling,
       with the file tree hidden behind a toggle inside that. They are peers, so they are tabs. -->
  <md-tabs id="ptabs" hidden>
    <md-primary-tab id="ptabTalk"></md-primary-tab>
    <md-primary-tab id="ptabFacts"></md-primary-tab>
    <md-primary-tab id="ptabFiles"></md-primary-tab>
    <md-primary-tab id="ptabPlan"></md-primary-tab>
  </md-tabs>
  <div id="agentview">
    <!-- The workspace, on the leading side, opposite the state pane. Two panes and not one:
         a console with a single sidebar makes somebody choose between seeing the files and seeing
         what the agent is doing, and Zed has an open issue about exactly that. What is on the left
         is what the work is made of; what is on the right is what is happening to it.
         Shut by default and remembered, like the state pane: the conversation is what the page is
         for, and a reader who wants the tree asks for it once. -->
    <div id="filecol">
      <aside id="files"></aside>
      <!-- The column's own edge, as a control. A window splitter in the ARIA sense: focusable,
           arrow keys move it, and what it writes is the custom property the grid track is made of.
           Drawn as a hairline that thickens under the pointer rather than as a bar, because most
           of the time the answer to "how wide" is already right and a permanent bar is furniture. -->
      <div id="filesGrip" class="grip" role="separator" aria-orientation="vertical" tabindex="0"></div>
    </div>
    <div id="stream">
      <!-- One slot, two things in it. The facts card answers "what am I looking at"; a file opened
           from the tree answers "what is it made of" — both are reference above the conversation,
           and stacking them would push the transcript off the screen the way the facts alone once
           did. So they share the slot and a tab says which is showing, which is what an editor
           does with the same problem. Hidden until there is more than one thing to choose. -->
      <md-tabs id="cardtabs" hidden></md-tabs>
      <md-outlined-card id="detail" hidden></md-outlined-card>
      <md-outlined-card id="fileview" hidden></md-outlined-card>
      <div id="log"></div>
    </div>
    <!-- The handle and the pane it opens are one column: siblings of #stream, a grid would place
         them in reading order and put the pane on a row of its own beneath the conversation. -->
    <!-- One level in from the conversation: a council member's verdict, or a child the turn
         spawned. Its own section rather than a dialog, because what is in it is a transcript or a
         page of evidence — things you scroll, select and copy out of. -->
    <section id="agentdetail" hidden></section>

    <div id="sidecol">
      <div id="sideGrip" class="grip lead" role="separator" aria-orientation="vertical" tabindex="0"></div>
      <aside id="side">
        <md-outlined-card id="plan" hidden></md-outlined-card>
        <!-- What is running beside the turn: a background command, a spawned child. It was a strip
             in the dock, above the composer and on screen whatever you were doing — which on a
             phone was 90px of somebody else's business over the thing you came to use, and on a
             desktop a band that was there whether or not anything was running.
             Under the plan, not over it: the plan is what this companion is trying to do and holds
             still, and this is what is happening in the next few seconds. Read in that order, the
             second is a detail of the first; the other way round it is a detail without its
             subject. -->
        <md-outlined-card id="strip" hidden></md-outlined-card>
        <md-outlined-card id="handoffs" hidden></md-outlined-card>
        <md-outlined-card id="queued" hidden></md-outlined-card>
        <md-outlined-card id="cron" hidden></md-outlined-card>
      </aside>
    </div>
  </div>
</main>


<!-- Preferences, in one place instead of four. As a section at the foot of every page these were
     the same three controls repeated under lists somebody was reading for something else; as a
     panel in the rail they were a second copy of that. A dialog is what M3 uses for a short task
     that interrupts nothing, and it is the same dialog at every width. -->

<!-- Adding a server is a task with six fields and one outcome, which is what a dialog is for. It
     sat inline under the list, so the page a person came to READ ended in a form they were not
     filling in, and the one control that committed it was a button inside that form with nothing
     to say it was the confirming one. The actions live in the dialog's own slot now: cancel, then
     add, trailing-aligned, with the confirming action nearest the corner. -->
<md-dialog id="mcpDialog">
  <div slot="headline" id="mcpDialogK"></div>
  <form slot="content" id="mcpForm" method="dialog"></form>
  <!-- Text buttons, which is what the guide gives a dialog, trailing-aligned with the confirming
       action nearest the corner. A filled button here would be the page's highest emphasis spent
       inside a box that is already the only thing the reader can touch. -->
  <div slot="actions">
    <md-text-button id="mcpCancel" form="mcpForm" value="cancel"></md-text-button>
    <md-text-button id="mcpGo" form="mcpForm" value="add"></md-text-button>
  </div>
</md-dialog>

<!-- Interrupting is a decision, so it is asked as one.
     The guide keeps a dialog for "critical information that requires a decision" and gives the
     shape: a headline that states the question concretely rather than "Are you sure?", two actions
     at most, the dismissive one to the LEFT of the confirming one, and a confirming label that
     says what will happen rather than "OK". -->
<md-dialog id="stopDialog" type="alert">
  <div slot="headline" id="stopK"></div>
  <div slot="content" id="stopBody"></div>
  <div slot="actions">
    <md-text-button id="stopCancel"></md-text-button>
    <!-- armed: the page's existing vocabulary for a control that destroys something, and the
         asking is what is red. -->
    <md-text-button id="stopGo" class="armed"></md-text-button>
  </div>
</md-dialog>

<!-- Asking for one line of text, in the page's own dialog.
     Five places wanted a name — somebody to add to the permissions list, a branch, a new file, a
     new folder, something renamed — and all five used the browser's prompt(). Which is a modal
     the page cannot style, cannot label in the reader's language, cannot put a hint under, and
     which some browsers refuse outright in a page that has not been interacted with. The rest of
     this console asks with md-dialog; this is the same dialog with a field in it. -->
<!-- One keystroke to anything. Ctrl/⌘+K, and the list under the field is the page's own verbs and
     whatever this console can name: companions, the files of the workspace on screen, meetings,
     past sessions. It is a dialog like the others rather than a bar of its own because it is a
     short task that interrupts nothing, which is what the guide gives a dialog for. -->
<md-dialog id="palDialog">
  <div slot="headline" id="palK"></div>
  <div slot="content">
    <!-- autofocus, because the field is not the first focusable thing in here on a phone.
         The dialog focuses `[autofocus]` if it finds one and otherwise the first control it can
         see, and at compact that is the close x in the headline: measured at 390px, the palette
         opened, three characters were typed, and the field still read "" with all ten rows
         showing. The one thing this dialog is for is typing into it. -->
    <md-outlined-text-field id="palField" autofocus></md-outlined-text-field>
    <!-- A listbox, and the rows are options: this is a chooser, and a screen reader that is told
         "list" hears a list of text rather than a set of things one of which is about to happen. -->
    <div id="palList" role="listbox" tabindex="-1"></div>
    <div id="palNone" hidden></div>
  </div>
  <div slot="actions">
    <md-text-button id="palCancel"></md-text-button>
  </div>
</md-dialog>

<md-dialog id="askDialog">
  <div slot="headline" id="askK"></div>
  <div slot="content">
    <div id="askBody"></div>
    <md-outlined-text-field id="askField"></md-outlined-text-field>
    <!-- Some questions have a second half. Adding somebody asks who AND as what: the role decided
         itself before this existed, and on a console with nobody on it yet the one it chose was
         always refused — the first person has to be able to admin or the console would refuse to
         start without them. A dialog that picks silently is a dialog that can pick wrongly. -->
    <md-outlined-select id="askPick" hidden></md-outlined-select>
  </div>
  <div slot="actions">
    <!-- A question the page can answer for you. The commit dialog uses it to draft the message
         from what is staged; the button sits away from the two that end the dialog, because it
         does neither. -->
    <md-text-button id="askExtra" hidden></md-text-button>
    <md-text-button id="askCancel"></md-text-button>
    <md-text-button id="askGo"></md-text-button>
  </div>
</md-dialog>

<!-- The shape of the report a companion has to fill in before it may put a decision to somebody.
     The sections are a contract — the tool refuses a report with one missing — and the person the
     report is FOR is the one who knows what belongs in it. Editing it meant writing a markdown file
     into a workspace until now. -->
<md-dialog id="fmtDialog">
  <div slot="headline" id="fmtK"></div>
  <form slot="content" id="fmtForm" method="dialog"></form>
  <div slot="actions">
    <md-text-button id="fmtCancel" form="fmtForm" value="cancel"></md-text-button>
    <md-text-button id="fmtGo" form="fmtForm" value="save"></md-text-button>
  </div>
</md-dialog>

<footer id="dock">
  <!-- The dock's contents stand in the page's column, so they are inside a box with the page's
       geometry rather than pinned to the window. Fixed and full width, they hugged the left while
       main centred itself on a wide monitor: measured at 2488px, the conversation began at 339 and
       the composer under it at 120. The bay is main's own rule — same cap, same centring — and the
       reading measure applies INSIDE it, left-aligned, exactly as the transcript does inside main.
       Not #dock itself, which stays full width so its fade still covers the whole foot of the page. -->
  <div class="bay">
  <div id="prompt" hidden></div>
  <form id="f" hidden><div class="composer">
    <md-outlined-text-field id="t" type="textarea" rows="1"
      ></md-outlined-text-field>
    <md-filled-button type="submit" id="send">send</md-filled-button>
    <!-- Stopping a turn is answering for it: the same person who may say "no, don't run that" may
         say "stop". Somebody who may only look is not offered the button that ends somebody
         else's work. -->
    <md-filled-tonal-button type="button" id="stop" data-may="answer">interrupt</md-filled-tonal-button>
  </div><div id="cnote" hidden></div></form>
  </div>
</footer>

<script type="module">
<!--magi:js-->
</script>
